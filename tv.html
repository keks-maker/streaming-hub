      // pointer-events:none-Container (der Listener überlebt Marker-Rebuilds).
      // Solange der Schutz aktiv ist, friert syncDvrMarkers Rebuilds ein;
      // Positions-/Tooltip-Updates laufen in-place weiter.
      scrubMarkersEl.addEventListener('pointerover', function(ev) {
        if (ev.target && ev.target.closest && ev.target.closest('.tv-scrub-marker')) {
          pointerOverMarker = true;
          markerHoverGuardUntil = Date.now() + 60000;
        }
      });
      scrubMarkersEl.addEventListener('pointerout', function(ev) {
        if (ev.target && ev.target.closest && ev.target.closest('.tv-scrub-marker')) {
          pointerOverMarker = false;
          // Kurzer Übergangs-Tail (Tooltip-Fade .15s), dann sind Rebuilds
          // wieder freigegeben — neue Marker verzögern sich nicht merklich.
          markerHoverGuardUntil = Date.now() + 300;
        }
      });
      liveBtn.addEventListener('click', function(ev) { ev.stopPropagation(); goLive(); });
      rewindBtn.addEventListener('click', function(ev) {
        ev.stopPropagation();
        if (dvrState.enabled) trySeek(video.currentTime - 10);
      });
      forwardBtn.addEventListener('click', function(ev) {
        ev.stopPropagation();
        if (dvrState.enabled && !dvrState.isLive) trySeek(video.currentTime + 10);
      });

      // Zeit-Update: Scrub + Rest-Zeit live ajustieren
      setInterval(function() {
        if (dvrState.enabled && !dvrState.dragging) {
          // DVR-Fenster zwischen den hls.js-Playlist-Events auffrischen
          if (hlsInstance && hlsInstance.latestLevelDetails) updateDvrFromLevelDetails(hlsInstance.latestLevelDetails);
          // isLive check: currentTime within 30s of live edge
          var wasLive = dvrState.isLive;
          dvrState.isLive = video.currentTime >= dvrState.windowEnd - 30;
          if (wasLive !== dvrState.isLive) updateLiveUi();
          renderScrub();
        }
      }, 250);

      // ═════════ Aufnahme (Phase 1c) ═════════
      // Chrome-UI der Aufnahme: Record-Button (Start-Dialog / Stopp), REC-Chip
      // in der Controls-Bar (blendet mit dem Chrome ein/aus, zeigt die
      // LAUFENDE Aufnahme unabhängig vom gerade gesehenen Kanal) und
      // Auto-Stopp-Kontext „bis zum Ende der Sendung“ (EPG-Ende als
      // Auto-Stopp — die Planung läuft im Host-Renderer, der die EPG-Daten
      // autoritativ besitzt). Aufnahme-Logik bleibt in der Engine
      // (recording:*-IPC); tv.html konsumiert nur und schickt Requests.

      const recordBtn = document.getElementById('tvRecordBtn');
      const recordIconIdle = document.getElementById('tvRecordIconIdle');
      const recordIconActive = document.getElementById('tvRecordIconActive');
      const recChip = document.getElementById('tvRecChip');
      const recTimeEl = document.getElementById('tvRecTime');
      const recChannelEl = document.getElementById('tvRecChannel');
      const recTitleEl = document.getElementById('tvRecTitle');
      const recMenu = document.getElementById('tvRecMenu');
      const recStartNowBtn = document.getElementById('tvRecStartNow');
      const recStartUntilEndBtn = document.getElementById('tvRecStartUntilEnd');
      // Karte t_f36663be: „Ab Bildposition" + „Aktuell angezeigte Sendung"
      const recStartAtPositionBtn = document.getElementById('tvRecStartAtPosition');
      const recStartShowBtn = document.getElementById('tvRecStartShow');
      // Fix-Set 3 · Punkt 4: tvRecStop (statischer „Aufnahme stoppen"-
      // Menüpunkt) wird durch die DYNAMISCHE Aufnahmen-Liste ersetzt — der
      // Container recMenuEntries liegt im Menü, jedes Element ist ein Stop.
      const recMenuEntries = document.getElementById('tvRecEntries');
      const recMenuNote = document.getElementById('tvRecMenuNote');

      // Letzter recording:status-Snapshot des Hosts: { active: [...], remuxing: [...] }
      var recordingStatus = { active: [], remuxing: [] };
      // Kontext des aktuell gesehenen Kanals (vom Host via switch-channel)
      var recChannelCtx = { channelId: '', channelName: '', epgStopMs: null };
      var recTickTimer = null;

      function sendRecordingRequest(action, payload) {
        var msg = { source: 'tv-player', action: 'recording-' + action };
        if (payload) for (var k in payload) { if (Object.prototype.hasOwnProperty.call(payload, k)) msg[k] = payload[k]; }
        sendToHostOrSelf(msg);
      }

      // ── tv-player → Host-Bridge (F-FB-07, t_9372a4b3) ──
      // Die tvView wird via loadURL('file://…') geladen; unter Electron 42 ist
      // der Origin eines file://-Guests "null" — window.postMessage(msg,
      // window.location.origin) wirft dort "Invalid target origin 'null'" und
      // die Nachricht verließ tv.html NIE (Record-Button tot, EPG-Poll tot,
      // Status-Request tot). Zielführend: targetOrigin '*' (eigenes Window,
      // kein Cross-Origin-Leak) mit Empfangs-Gate im preload (action-
      // Whitelist, siehe preload-content.js). '*' ist bewusst NUR für diese
      // internen tv-player-Nachrichten erlaubt — fremde Seiten im tvView
      // gibt es nicht (loadURL nur auf die eigene tv.html).
      function sendToHostOrSelf(msg) {
        try { window.postMessage(msg, '*'); return; } catch (_) {}
        try { window.postMessage(msg); } catch (_) {}
      }

      // Aktive Aufnahme auf DEM aktuellen Kanal (kanalgebundener Button-Zustand)
      function activeRecordingForCurrentChannel() {
        var list = recordingStatus.active || [];
        for (var i = 0; i < list.length; i++) {
          var a = list[i];
          if (recChannelCtx.channelId && a.channelId === recChannelCtx.channelId) return a;
        }
        return null;
      }

      function recElapsedSec(active) {
        if (!active) return 0;
        if (typeof active.recordingSec === 'number' && active.recordingSec > 0) return active.recordingSec;
        var started = Date.parse(active.startedAt || '');
        return isFinite(started) ? Math.max(0, (Date.now() - started) / 1000) : 0;
      }

      function recTick() {
        var list = recordingStatus.active || [];
        var shown = list.length ? list[0] : null;
        if (!shown) { stopRecTick(); return; }
        // Fix-Set 3 · Punkt 5: stopping-RecId → der Chip zeigt „Wird beendet…"
        // statt einer Uhr (der Wert würde sonst bis zum Remux-Done stehen).
        if (isRecStopping(shown.recId)) { updateChipStopping(shown.recId); return; }
        // 1-s-Auflösung (Fix-Set 3, Punkt 3): Der Engine-Snapshot kommt nur alle
        // 5 s (SIZE_TICK_MS); die Laufzeit wird deshalb JEDEN Tick aus dem
        // Startzeitpunkt selbst fortgeschrieben (recordingSec ist nur Anker).
        var elapsed = recElapsedSec(shown);
        if (typeof shown.recordingSec === 'number' && shown.recordingSec > 0 && recTickAnchor.recId === shown.recId) {
          // Anchor: letzter Engine-Wert → Offset gegen weiterreichende Drift.
          elapsed = shown.recordingSec + Math.max(0, (Date.now() - recTickAnchor.recordingTs) / 1000);
        }
        recTimeEl.textContent = formatRecTime(elapsed);
      }

      // ═══ Aufnahme (Fix-Set 3): REC-Chip-Uhr ═══
      // formatTime (hier: Material für DVR) ist MM:SS-basiert und kürzt unter
      // 1 h ohne Stundenfeld — der Chip braucht verpflichtend hh:mm:ss, damit
      // >59 min nicht optisch „ kaum gewachsen" wirkt (User-Meldung Punkt 3).
      function formatRecTime(totalSec) {
        if (!totalSec || !isFinite(totalSec)) totalSec = 0;
        var t = Math.max(0, Math.floor(totalSec));
        var h = Math.floor(t / 3600);
        var m = Math.floor((t % 3600) / 60);
        var s = t % 60;
        var pad = function(n) { return String(n).padStart(2, '0'); };
        return pad(h) + ':' + pad(m) + ':' + pad(s);
      }

      // Anchor zwischen Engine-Wert + lokalem Ticker (recTick)
      var recTickAnchor = { recId: null, recordingSec: 0, recordingTs: 0 };

      function recordRecTickAnchorFrom(status) {
        var list = status && status.active;
        if (list && list.length) {
          var shown = list[0];
          if (typeof shown.recordingSec === 'number' && shown.recordingSec > 0) {
            recTickAnchor = { recId: shown.recId, recordingSec: shown.recordingSec, recordingTs: Date.now() };
            return;
          }
        }
        recTickAnchor = { recId: null, recordingSec: 0, recordingTs: 0 };
      }

      function startRecTick() {
        stopRecTick();
        recTickTimer = setInterval(recTick, 1000);
        recTick();
      }
      function stopRecTick() {
        if (recTickTimer) { clearInterval(recTickTimer); recTickTimer = null; }
      }

      // Zustand anwenden: Button-Optik (kanalbezogen) + Chip (laufende Aufnahme)
      function applyRecordingState(status) {
        recordingStatus = status && typeof status === 'object' ? status : { active: [], remuxing: [] };
        recordRecTickAnchorFrom(recordingStatus);
        var list = recordingStatus.active || [];
        var activeHere = activeRecordingForCurrentChannel();
        var shown = list.length ? list[0] : null;

        if (activeHere) {
          recordBtn.classList.add('recording');
          recordBtn.title = 'Aufnahme stoppen (R) — läuft seit ' + formatRecTime(recElapsedSec(activeHere));
          recordIconIdle.style.display = 'none';
          recordIconActive.style.display = 'block';
        } else {
          recordBtn.classList.remove('recording');
          recordBtn.title = 'Aufnahme starten (R)';
          recordIconIdle.style.display = 'block';
          recordIconActive.style.display = 'none';
        }

        if (shown) {
          recChip.style.display = 'flex';
          recChip.classList.remove('stopping');
          recChip.title = 'Laufende Aufnahme: Klicken zum Verwalten/Beenden';
          recChannelEl.textContent = '· ' + (shown.channelName || 'Kanal');
          recTitleEl.textContent = shown.epgTitle ? '— ' + shown.epgTitle : '';
          // Fix-Set 3 · Punkt 3: hh:mm:ss (formatRecTime), ohne Engine-Refresh
          // durch dry-run gesetzt, damit der Ticker (recTick) fortlaufen kann.
          if (!recTickTimer) { startRecTick(); } else { recTick(); }
        } else if (Object.keys(recStopping).length) {
          // Fix-Set 3 · Punkt 5: Aufnahme bereits aus der Aktiv-Liste (Snapshot
          // kam zwischen Stop-Klick und done-Phase) — Chip bleibt als
          // Beenden-Feedback sichtbar, bis 'done' den Stopp souverän aufräumt.
          updateChipStopping(Object.keys(recStopping)[0]);
        } else {
          recChip.style.display = 'none';
          recChip.classList.remove('stopping');
          stopRecTick();
        }
        if (recMenu.classList.contains('open')) updateRecMenuItems();
      }

      // ═══ Aufnahme (Fix-Set 3 · Punkt 5): Stopp-Feedback ═══
      // Die Engine sendet beim User-Stop zuerst {phase:'stopping'} (ffmpeg
      // schreibt sauber, danach Remux) — das macht GUI-seitig Sekunden
      // Funkstille.(tv.html zeigt daher zwischen „recording“ und „done“
      // einen Beenden-Zustand im Chip und im Start-Dialog an.)
      var recStopping = {}; // recId → true (wird von recording:'stopping'/'done' Events verwaltet)
      function setRecStopping(recId, on) {
        if (on) recStopping[recId] = true;
        else delete recStopping[recId];
      }
      function isRecStopping(recId) { return !!recStopping[recId]; }

      /**
       * Fix-Set 3 · Punkt 5: Der zeigt laufende Aufnahme im Chip geht in den
       * Beenden-Zustand: roter Punkt friert an, Label „Wird beendet…". Der
       * Übergang zu „done" (Remux fertig, MP4 bereit) räumt über
       * applyRecordingState wieder auf.
       */
      function updateChipStopping(recId) {
        var a = (recordingStatus.active || []).find(function(x) { return x.recId === recId; });
        recChip.style.display = 'flex';
        recChannelEl.textContent = '· ' + (a && a.channelName || 'Kanal');
        recTitleEl.textContent = 'Aufnahme wird beendet…';
        recTimeEl.textContent = '——:——:——';
        recChip.classList.add('stopping');
        recChip.title = 'Aufnahme wird beendet — die fertige MP4 erscheint in der Aufnahmen-Bibliothek';
      }

      // Fix-Set 3 · Punkt 4: Im 'manage'-Modus listet das Menü ALLE laufenden
      // Aufnahmen (jede mit eigenem Stop-Entry). Im 'start'-Modus gilt der
      // alte kanalbezogene Dialog. Stopp-Feedback (Punkt 5): wegbrechende
      // Aufnahmen erscheinen als „Wird beendet…" (disabled).
      function updateRecMenuItems() {
        var list = (recordingStatus.active || []).filter(function(a) {
          return !isRecStopping(a.recId);
        });
        var stoppingIds = Object.keys(recStopping).filter(function(id) {
          return (recordingStatus.active || []).some(function(a) { return a.recId === id; });
        });
        var modus = recMenuMode;

        // Start-Entries nur im 'start'-Modus ANBIETEN (nie aus dem REC-Chip).
        var activeHere = activeRecordingForCurrentChannel();
        var startMode = modus === 'start' && !activeHere;
        recStartShowBtn.style.display = startMode ? '' : 'none';
        recStartNowBtn.style.display = startMode ? '' : 'none';
        recStartUntilEndBtn.style.display = (startMode && recChannelCtx.epgStopMs) ? '' : 'none';
        // Karte t_f36663be: Δ-Berechnung playbackTime ↔ Live-Kante.
        // Δ < 30 s → „Ab Bildposition" disabled (ausgegraut); sonst enabled
        // mit Label „(−hh:mm)".
        var dvrDelta = 0;
        if (dvrState.enabled && !dvrState.isLive) {
          dvrDelta = Math.max(0, Math.round(dvrState.windowEnd - video.currentTime));
        }
        if (startMode) {
          if (dvrDelta >= 30) {
            recStartAtPositionBtn.style.display = '';
            recStartAtPositionBtn.classList.remove('tv-rec-disabled');
            recStartAtPositionBtn.textContent = '⏺ Ab Bildposition starten (Startet ' +
              formatRecTime(dvrDelta) + ' zurück)';
          } else {
            recStartAtPositionBtn.style.display = '';
            recStartAtPositionBtn.classList.add('tv-rec-disabled');
            recStartAtPositionBtn.textContent = '⏺ Ab Bildposition starten';
            recStartAtPositionBtn.title = 'Bereits am Live-Bild — nichts zurückzuspringen';
          }
        } else {
          recStartAtPositionBtn.style.display = 'none';
        }
        // Live-Hinweis­zeile (Meldung 1, wortgleich): immer bei Start-Dialog,
        // wenn am Live-Bild (Δ < 30 s) — dort startet die Aufnahme am Live-Bild.
        var showLiveHint = startMode && dvrDelta < 30;

        // Fix-Set 3 · Punkt 4: dynamische Aufnahmen-Einträge (jede aktive
        // Aufnahme ist von hier stoppbar — auch der andere Kanal).
        recMenuEntries.innerHTML = '';
        list.forEach(function(a) {
          var entry = document.createElement('button');
          entry.className = 'tv-rec-menu-item recording';
          entry.textContent = '⏹ ' + (a.channelName || 'Kanal') +
            (a.epgTitle ? ' — ' + a.epgTitle : '') + ' · ' + formatRecTime(recElapsedSec(a)) + ' beenden';
          entry.title = 'Aufnahme auf „' + (a.channelName || 'diesem Kanal') + '" stoppen';
          entry.addEventListener('click', function(ev) {
            ev.stopPropagation();
            closeRecMenu();
            sendRecordingRequest('stop', { recId: a.recId });
          });
          recMenuEntries.appendChild(entry);
        });
        stoppingIds.forEach(function(id) {
          var a = (recordingStatus.active || []).find(function(x) { return x.recId === id; }) || {};
          var entry = document.createElement('div');
          entry.className = 'tv-rec-menu-item recording tv-rec-stopping';
          entry.textContent = '◌ ' + (a.channelName || 'Kanal') + ' — Aufnahme wird beendet…';
          recMenuEntries.appendChild(entry);
        });

        recMenuNote.textContent = '';
        if (activeHere && modus === 'start') {
          recMenuNote.textContent = '● REC ' + formatRecTime(recElapsedSec(activeHere)) +
            ' · ' + (activeHere.channelName || 'Kanal') + (activeHere.epgTitle ? ' — ' + activeHere.epgTitle : '');
        } else if (modus === 'start' && (recordingStatus.active || []).length && !activeHere) {
          recMenuNote.textContent = 'Es läuft bereits eine andere Aufnahme.';
        } else if (showLiveHint) {
          // Meldung 1 (wortgleich, User-Freigabe): Startet immer am Live-Bild.
          recMenuNote.textContent = 'Hinweis: Startet immer am aktuellen Live-Bild.';
          if (!recChannelCtx.epgStopMs) recMenuNote.textContent += ' Kein EPG verfügbar.';
        } else if (modus === 'manage' && !list.length && !stoppingIds.length) {
          recMenuNote.textContent = 'Keine laufenden Aufnahmen.';
        }
      }

      function closeRecMenu() { recMenu.classList.remove('open'); }
      // Fix-Set 3 · Punkt 4: mode 'start' = Start-Dialog (Record-Button),
      // 'manage' = Verwaltung der laufenden Aufnahmen (REC-Chip).
      var recMenuMode = 'start';
      function openRecMenu(mode) {
        recMenuMode = mode === 'manage' ? 'manage' : 'start';
        var r = (recMenuMode === 'manage' ? recChip : recordBtn).getBoundingClientRect();
        recMenu.style.right = Math.max(8, window.innerWidth - r.right) + 'px';
        recMenu.style.bottom = Math.max(8, window.innerHeight - r.top + 8) + 'px';
        recMenu.style.left = 'auto';
        recMenu.style.top = 'auto';
        updateRecMenuItems();
        recMenu.classList.add('open');
        showOverlay();
      }

      recordBtn.addEventListener('click', function(ev) {
        ev.stopPropagation();
        var activeHere = activeRecordingForCurrentChannel();
        // Fix-Set 3 · Punkt 4 (Akzeptanz: Klick-auf-rot = Stop-Flow): Läuft
        // auf diesem Kanal bereits eine Aufnahme, stoppt der Record-Button
        // SIE DIREKT — kein Umweg über den Start-Dialog.
        if (activeHere) {
          setRecStopping(activeHere.recId, true);
          sendRecordingRequest('stop', { recId: activeHere.recId });
          updateChipStopping(activeHere.recId);
          return;
        }
        if (recMenu.classList.contains('open')) { closeRecMenu(); return; }
        openRecMenu('start');
      });
      // Fix-Set 3 · Punkt 4: Der REC-Chip gehört zur VERWALTUNG. Er öffnet das
      // Menü im „Verwalten"-Modus: erst Einträge der LAUFENDEN Aufnahmen
      // (Stoppen), kein Start-Dialog des aktiven Kanals.
      recChip.addEventListener('click', function(ev) {
        ev.stopPropagation();
        openRecMenu('manage');
      });
      recStartNowBtn.addEventListener('click', function(ev) {
        ev.stopPropagation();
        closeRecMenu();
        // Karte t_f36663be: Standard-Aufnahme ab Live-Bild (startOffsetSec 0).
        sendRecordingRequest('start', {});
      });
      // Karte t_f36663be, Option „Ab Bildposition“: DVR-Rückstand des Players
      // als startOffsetSec schicken (Empfänger: renderer recording-start).
      recStartAtPositionBtn.addEventListener('click', function(ev) {
        ev.stopPropagation();
        closeRecMenu();
        var dvrDelta = dvrState.enabled && !dvrState.isLive
          ? Math.max(0, Math.round(dvrState.windowEnd - video.currentTime))
          : 0;
        if (dvrDelta < 30) return; // disabled-Fall (pointer-events fängt das,
        // aber defensiv: kein Off-Chance-Start am Live-Bild)
        sendRecordingRequest('start', { startOffsetSec: dvrDelta });
      });
      // Karte t_f36663be, Option 2 „Aktuell angezeigte Sendung aufnehmen“:
      // EPG-Startzeit der laufenden Sendung als DVR-Rückstand; Autostopp
      // am EPG-Ende (identifizierte Sendung). Player-Bild bleibt UNVERÄNDERT
      // (die Rec-Engine seekt, nicht der Player).
      recStartShowBtn.addEventListener('click', function(ev) {
        ev.stopPropagation();
        closeRecMenu();
        // Identifizierte Sendung: aktueller EPG-Eintrag (start/stop) dieses Kanals
        var nowMs = Date.now();
        var show = null;
        for (var ei = 0; ei < epgEntries.length; ei++) {
          var ent = epgEntries[ei];
          var sMs = parseEpgTime(ent.start).getTime();
          var eMs = parseEpgTime(ent.stop).getTime();
          if (sMs <= nowMs && eMs > nowMs) { show = { startMs: sMs, stopMs: eMs, title: ent.title }; break; }
        }
        if (!show) {
          // EPG nicht erkennbar (wortgegebener Fallback-Dialog vom User):
          // kleiner 2-Button-Dialog statt stiller Live-Start.
          openRecShowUnavailableDialog();
          return;
        }
        var offsetSec = Math.max(0, Math.round((nowMs - show.startMs) / 1000));
        // DVR-Fenster-Check (.Δ > window → Meldung-3-Fallback-Dialog):
        var windowDepth = dvrState.enabled ? (dvrState.windowEnd - dvrState.windowStart) : 0;
        if (offsetSec > windowDepth) {
          openRecOutOfWindowDialog(offsetSec, windowDepth, show);
          return;
        }
        sendRecordingRequest('start', {
          startOffsetSec: offsetSec,
          epgTitleOverride: show.title || null,
          untilEpgEnd: true,
          epgEndMsOverride: show.stopMs,
        });
      });
      recStartUntilEndBtn.addEventListener('click', function(ev) {
        ev.stopPropagation();
        closeRecMenu();
        sendRecordingRequest('start', { untilEpgEnd: true });
      });
      recMenu.addEventListener('click', function(ev) { ev.stopPropagation(); });
      document.addEventListener('click', closeRecMenu);

      // ═══ Karte t_f36663be: Fallback-Dialoge ═══
      // Meldung 3 (wortgleich, User-Freigabe): EPG-Start > DVR-Fenster.
      // Meldung EPG-unavailable: Sendung nicht identifizierbar.
      // Beide: kleine Modal-Variante des rec-Menüs (gleiche Optik, kein
      // ganzseitiger Overlay — TV-Edit-Parität, „Back"-Taste schließt).
      function openRecFallbackDialog(opts) {
        var overlay = document.createElement('div');
        overlay.style.cssText =
          'position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(2,6,23,0.72);' +
          'display:flex;align-items:center;justify-content:center;z-index:1000;';
        var box = document.createElement('div');
        box.className = 'tv-rec-menu';
        box.classList.add('open');
        box.style.cssText = 'position:relative;right:auto;bottom:auto;left:auto;top:auto;max-width:520px;padding:6px;';
        var msg = document.createElement('div');
        msg.style.cssText = 'padding:10px 14px;font-size:14px;color:#e2e8f0;line-height:1.5;white-space:pre-line;';
        msg.textContent = opts.message;
        box.appendChild(msg);
        for (const btn of opts.buttons) {
          var b = document.createElement('button');
          b.className = 'tv-rec-menu-item';
          b.textContent = btn.label;
          b.addEventListener('click', function(ev) {
            ev.stopPropagation();
            overlay.remove();
            btn.onClick && btn.onClick();
          });
          box.appendChild(b);
        }
        overlay.appendChild(box);
        overlay.addEventListener('click', function(ev) {
          if (ev.target === overlay) overlay.remove();
        });
        document.body.appendChild(overlay);
      }

      function openRecShowUnavailableDialog() {
        openRecFallbackDialog({
          message: 'Sendung kann nicht erkannt werden — Aufnahme ab jetzt (Live-Bild)?',
          buttons: [
            { label: 'Ab jetzt aufnehmen', onClick: () => sendRecordingRequest('start', {}) },
            { label: 'Abbrechen' },
          ],
        });
      }

      function openRecOutOfWindowDialog(offsetSec, windowDepth, show) {
        var fmt = function(sec) {
          if (!isFinite(sec) || sec <= 0) return '0:00';
          var h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
          return (h > 0 ? h + ':' : '') + String(m).padStart(2, '0') + ' min';
        };
        // Meldung 3 (wortgleich, User-Freigabe): Zurückspulen nicht möglich.
        openRecFallbackDialog({
          message:
            'Zurückspulen nicht möglich — Das TV-Signal enthält die letzten ' +
            (isFinite(windowDepth) && windowDepth > 0 ? '~' + fmt(windowDepth) : 'wenige Minuten') +
            '. Ihre Bildposition (' + fmt(offsetSec) + ') liegt außerhalb — aber Aufnahme ist ab jetzt möglich.',
          buttons: [
            { label: 'Ja, aufnehmen (am Live-Bild)', onClick: () => sendRecordingRequest('start', {}) },
            { label: 'Abbrechen' },
          ],
        });
      }

      // ── Channel list overlay ──
      function esc(str) { return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

      function showChannelList(channels, currentIdx) {
        channelListData = channels;
        channelListIndex = currentIdx;
        var container = document.getElementById('tvChannelList');
        var inner = document.getElementById('tvChannelListInner');

        if (!channels || !channels.length) { container.classList.remove('visible'); return; }

        inner.replaceChildren();
        channels.forEach(function(ch, i) {
          var item = document.createElement('div');
          item.className = 'tv-channel-item' + (i === currentIdx ? ' active' : '');
          var info = document.createElement('div');
          info.className = 'tv-channel-info';
          var name = document.createElement('span');
          name.className = 'tv-channel-name';
          name.textContent = ch.name || '';
          info.appendChild(name);
          if (ch.epg) {
            var epg = document.createElement('span');
            epg.className = 'tv-channel-epg';
            epg.textContent = ch.epg;
            info.appendChild(epg);
          }
          if (ch.logo) {
            try {
              var logoUrl = new URL(ch.logo, document.baseURI);
              if (logoUrl.protocol === 'http:' || logoUrl.protocol === 'https:') {
                var logo = document.createElement('img');
                logo.src = logoUrl.toString();
                logo.alt = '';
                logo.loading = 'lazy';
                item.appendChild(logo);
              }
            } catch (_) {}
          }
          item.appendChild(info);
          inner.appendChild(item);
        });

        container.classList.add('visible');
        inner.offsetHeight;

        var firstItem = inner.firstElementChild;
        var itemHeight = firstItem ? firstItem.offsetHeight + parseFloat(getComputedStyle(firstItem).marginTop) + parseFloat(getComputedStyle(firstItem).marginBottom) : 66;
        var maxAvailHeight = window.innerHeight * 0.67 - 18;
        var visibleCount = Math.min(channels.length, Math.max(4, Math.floor(maxAvailHeight / itemHeight)));
        var containerHeight = visibleCount * itemHeight;
        container.style.height = (containerHeight + 18) + 'px';

        var half = (visibleCount - 1) / 2;
        var targetScroll = currentIdx * itemHeight - half * itemHeight;
        var maxScroll = Math.max(0, channels.length * itemHeight - containerHeight);
        var clamped = Math.max(0, Math.min(targetScroll, maxScroll));
        inner.style.transform = 'translateY(' + (-clamped) + 'px)';

        resetChannelListTimer();
      }

      function resetChannelListTimer() {
        clearTimeout(channelListTimer);
        channelListTimer = setTimeout(function() {
          document.getElementById('tvChannelList').classList.remove('visible');
        }, 4000);
      }

      function hideChannelList() {
        clearTimeout(channelListTimer);
        document.getElementById('tvChannelList').classList.remove('visible');
      }

      // ── Reusable channel setup ──
      function safeHttpUrl(value) {
        if (typeof value !== 'string' || !value.trim()) return '';
        try {
          var parsed = new URL(value, document.baseURI);
          if (parsed.username || parsed.password) return '';
          return parsed.protocol === 'http:' || parsed.protocol === 'https:' ? parsed.toString() : '';
        } catch (_) {
          return '';
        }
      }

      function setupChannel(url, name, logo, epg, start, end, next, channelId) {
        channelGen++;
        var gen = channelGen;
        var savedVolume = video.volume;
        var savedMuted = video.muted;
        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
        video.pause();
        video.removeAttribute('src');
        video.load();
        video.volume = savedVolume;
        video.muted = savedMuted;
        loadingEl.style.display = 'block';
        errorDiv.style.display = 'none';
        errorDiv.style.whiteSpace = '';
        audioTracks = [];
        audioDropdown.innerHTML = '';
        audioWrap.style.display = 'none';

        // Aufnahme-Kontext des Kanals (Phase 1c): bestimmt den kanalgebundenen
        // Button-Zustand. EPG-Ende liefert der Host beim nächsten epg-update.
        recChannelCtx = {
          channelId: typeof channelId === 'string' ? channelId : '',
          channelName: typeof name === 'string' ? name : 'TV',
          epgStopMs: null,
        };
        applyRecordingState(recordingStatus);

        // W2: Load-Watchdog sofort scharf schalten (vorher: erst nach 'playing',
        // wodurch tote Streams endlos im Ladezustand hingen)
        armLoadWatchdog();

        // DVR reset on channel switch (Orchestrator-Decision 4: kein Positions-Persisting)
        resetDvrState();
        // U1: Bar-Modus pro Kanal zurücksetzen; Host darf ihn via
        // switch-channel/epg-update überschreiben (dvr: 'on'|'off'|'auto').
        dvrBarMode = 'auto';

        const channelName = typeof name === 'string' ? name : 'TV';
        const channelLogo = safeHttpUrl(logo);

        topName.textContent = channelName;
        channelNameEl.textContent = channelName;

        updateEpgBar(epg, start, end, next);
        startEpgPolling();

        if (channelLogo) { topLogo.src = channelLogo; topLogo.style.display = 'block'; }
        else { topLogo.style.display = 'none'; }

        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: 'TV: ' + channelName,
            artist: 'Streaming Hub',
            album: 'TV',
            artwork: channelLogo ? [{ src: channelLogo, sizes: '256x256', type: 'image/png' }] : [],
          });
        }

        if (!url) {
          disarmLoadWatchdog(); // W2: sofortige Meldung genügt, kein Watchdog nötig
          showError('Keine Stream-URL');
          loadingEl.style.display = 'none';
          return;
        }

        let decodedUrl;
        try {
          decodedUrl = safeHttpUrl(decodeURIComponent(url));
        } catch (_) {
          decodedUrl = '';
        }
        if (!decodedUrl) {
          disarmLoadWatchdog();
          showError('Ungültige Stream-URL');
          loadingEl.style.display = 'none';
          return;
        }

        if (prevCanplay) video.removeEventListener('canplay', prevCanplay);
        if (prevWaiting) video.removeEventListener('waiting', prevWaiting);
        if (prevPlaying) video.removeEventListener('playing', prevPlaying);
        if (prevError) video.removeEventListener('error', prevError);
        if (prevLoadedMetadata) video.removeEventListener('loadedmetadata', prevLoadedMetadata);
        if (stallTimer) { clearInterval(stallTimer); stallTimer = null; }

        prevCanplay = function() {
          loadingEl.style.display = 'none';
          signalPlayback(); // W2: Lebenszeichen entwaffnet den Load-Watchdog
          showOverlay();
        };
        prevWaiting = function() {
          loadingEl.style.display = 'block';
          lastStallTime = Date.now();
        };
        prevPlaying = function() {
          loadingEl.style.display = 'none';
          signalPlayback(); // W2
          if (stallTimer) clearInterval(stallTimer);
          lastStallTime = Date.now();
          stallTimer = setInterval(function() {
            if (video.paused || video.ended) return;
            if (video.readyState < 2) return;
            if (Date.now() - lastStallTime > 15000) {
              showError('Stream hängt – keine Daten für 15s');
              if (stallTimer) clearInterval(stallTimer);
            }
          }, 3000);
        };
        prevError = function() {
          loadingEl.style.display = 'none';
          disarmLoadWatchdog();
          // W2: fatale Native-Player-Fehler gehören zum persistenten Dialog
          // (statt der 6s-Meldung, die den User allein lässt)
          showFatalError('Stream-Wiedergabe fehlgeschlagen');
        };

        video.addEventListener('canplay', prevCanplay);
        video.addEventListener('waiting', prevWaiting);
        video.addEventListener('playing', prevPlaying);
        video.addEventListener('error', prevError);

        try {
          var initHls = function() {
            pdtAnchor = null; // PDT-Anker ist kanalspezifisch
            if (typeof Hls === 'undefined' || !Hls.isSupported()) {
              video.src = decodedUrl;
              // Listener merken und bei Kanalwechsel entfernen (sonst akkumulieren sie)
              prevLoadedMetadata = function() {
                var nt = video.audioTracks;
                if (nt && nt.length) {
                  setAudioTracks(Array.from(nt).map(function(t, i) { return { name: t.label || 'Track ' + (i+1), lang: t.language, id: i }; }));
                } else { renderAudioTracks(); }
              };
              video.addEventListener('loadedmetadata', prevLoadedMetadata);
              return;
            }
            const hls = new Hls({
              enableWorker: false,
              maxBufferLength: 15,
              liveSyncDurationCount: 3,
              // Snapback: liveMaxLatencyDurationCount bewusst NICHT gesetzt.
              // hls.js-Default ist Infinity => der stream-controller sucht nie selbst
              // zur Live-Kante zurück ("Playback: ... is located too far from the
              // end of live sliding playlist"), egal wie weit hinten wir stehen.
              // Rückkehr zur Live-Kante nur explizit via goLive() (Orchestrator-Decision 3).
              // (liveMaxLatencyDurationCount: 30 snapbackt bei 2s-Segmenten bereits nach 60s.)
              subtitleTrackController: null,
            });
            hlsInstance = hls;
            hls.on(Hls.Events.DESTROYING, function() { if (hlsInstance === hls) hlsInstance = null; });
            hls.on(Hls.Events.LEVEL_LOADED, function(_event, data) {
              if (gen !== channelGen) return;
              updatePdtFromLevelDetails(data.details);
              // DVR sentinel: DVR-Fenster aus der Sliding-Playlist lesen
              updateDvrFromLevelDetails(data.details);
              recomputeDvrMarkers();
            });
            hls.on(Hls.Events.LEVEL_UPDATED, function(_event, data) {
              if (gen !== channelGen) return;
              updatePdtFromLevelDetails(data.details);
              updateDvrFromLevelDetails(data.details);
              recomputeDvrMarkers();
            });
            hls.loadSource(decodedUrl);
            hls.attachMedia(video);
            fetch(decodedUrl).then(function(r) { return r.text(); }).then(function(txt) {
              var parsed = parseAudioTracksFromManifest(txt);
              if (parsed.length && !audioTracks.length) setAudioTracks(parsed);
            }).catch(function() {});
            hls.on(Hls.Events.MANIFEST_LOADED, function(_event, data) {
              hlsInstance = hls;
              if (!audioTracks.length) {
                if (data.audioTracks && data.audioTracks.length) {
                  setAudioTracks(data.audioTracks);
                } else if (data.url) {
                  fetch(data.url).then(function(r) { return r.text(); }).then(function(txt) {
                    var parsed = parseAudioTracksFromManifest(txt);
                    if (parsed.length && !audioTracks.length) setAudioTracks(parsed);
                  }).catch(function() {});
                }
              }
            });
            hls.on(Hls.Events.MANIFEST_PARSED, function(_event, data) {
              hlsInstance = hls;
              if (data.audioTracks && data.audioTracks.length && !audioTracks.length) {
                setAudioTracks(data.audioTracks);
              }
              video.play().catch(function() {
                if (gen !== channelGen) return;
                video.muted = true;
                video.play().catch(function() {});
              });
            });
            // W2: Kein Reset des Recovery-Zählers bei MANIFEST_LOADED –
            // signalPlayback() (canplay/playing) ist der einzige legitime Reset,
            // sonst würden sich Manifest-OK/Segmente-tot-Zyklen endlos retryen.
            hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, function() {
              if (hlsInstance) {
                var t = hlsInstance.audioTracks || hlsInstance.allAudioTracks || [];
                if (t && t.length) setAudioTracks(t);
              }
            });
            hls.on(Hls.Events.ERROR, function(_event, data) {
              if (gen !== channelGen) return;
              if (data.fatal) {
                // W2: fatale hls.js-Fehler zählen strike-weise. Nach 4 Strikes ohne
                // erfolgreiches Lebenszeichen (canplay/playing setzt zurück) wird
                // nicht mehr endlos gestartet, sondern der persistente Dialog gezeigt.
                hlsRecoverCount++;
                if (hlsRecoverCount > 3) {
                  disarmLoadWatchdog();
                  loadingEl.style.display = 'none';
                  showFatalError('Stream nicht erreichbar (' + (data.details || data.type) + ')');
                  return;
                }
                switch (data.type) {
                  case Hls.ErrorTypes.NETWORK_ERROR:
                    hls.startLoad();
                    break;
                  case Hls.ErrorTypes.MEDIA_ERROR:
                    hls.recoverMediaError();
                    break;
                  default:
                    disarmLoadWatchdog();
                    loadingEl.style.display = 'none';
                    showFatalError('Stream-Fehler (' + (data.details || data.type) + ')');
                    break;
                }
              }
            });
            renderAudioTracks();
          };
          if (typeof Hls !== 'undefined') { initHls(); }
          else { loadHlsJs(initHls); }
        } catch (e) {
          showError('Fehler: ' + e.message);
          loadingEl.style.display = 'none';
        }
      }

      // ── Initial load from URL params ──
      var params = new URLSearchParams(location.search);
      var hlsPath = params.get('hls');
      if (hlsPath) {
        try { window.__streamingHubHlsPath = decodeURIComponent(hlsPath); } catch (_) {}
      }
      setupChannel(
        params.get('channel'), params.get('name'), params.get('logo'),
        params.get('epg'), params.get('epgStart'), params.get('epgEnd'), params.get('epgNext'),
        params.get('channelId') || ''
      );
      // A-Fail R2-FB-01 (t_d6ee955e): Fallback für die Lücke zwischen tv.html
      // DOM ready und dem ersten Renderer-Channel-Push (reload/restore-Race):
      // Die Setup-Route fragt den Renderer nach dem Kanal-Kontext, der
      // Renderer antwortet mit einem vollen switch-channel (inkl. channelId)
      // → recChannelCtx besetzt, Record-Button kanalgebunden korrekt.
      sendToHostOrSelf({ source: 'tv-player', action: 'channel-context' });
      // Aufnahmen (Phase 1c): Host nach dem aktuellen Status fragen — der
      // tv-player-command-Bridge-Pfad antwortet via recording-status-Push.
      sendToHostOrSelf({ source: 'tv-player', action: 'recording-status' });

      function handleHostMessage(data) {
        if (!data) return;
        if (data.type === 'switch-channel') {
          // A-Fail R2-FB-01 (t_d6ee955e): contextOnly = NUR Re-Kontext nach dem
          // Initial-Load (channel-context-Anfrage) — kein HLS-Neustart, nur
          // recChannelCtx/DVR-Modus aktualisieren (kein setupChannel-Replay).
          if (data.contextOnly) {
            recChannelCtx = {
              channelId: typeof data.channelId === 'string' ? data.channelId : '',
              channelName: typeof data.name === 'string' ? data.name : 'TV',
              epgStopMs: null,
            };
            if (data.dvr === 'on' || data.dvr === 'off') {
              dvrBarMode = data.dvr;
              applyDvrBarMode();
            }
            applyRecordingState(recordingStatus);
            updateEpgBar(data.epg, data.epgStart, data.epgEnd, data.epgNext);
            return;
          }
          setupChannel(data.url, data.name, data.logo, data.epg,
            data.epgStart, data.epgEnd, data.epgNext, data.channelId);
          if (data.dvr === 'on' || data.dvr === 'off') {
            dvrBarMode = data.dvr;
            applyDvrBarMode();
          }
          if (data.channelList && data.channelIndex !== undefined) {
            showChannelList(data.channelList, data.channelIndex);
          }
        } else if (data.type === 'channel-list') {
          if (data.channels && data.currentIndex !== undefined) {
            channelListData = data.channels;
            channelListIndex = data.currentIndex;
          }
        } else if (data.type === 'epg-update') {
          updateEpgBar(data.epg, data.epgStart, data.epgEnd, data.epgNext);
          // Aufnahme-Kontext: Ende der laufenden Sendung (Auto-Stopp-Option).
          // Format der Roh-EPG-Einträge: XMLTV-Zeitstrings (start/stop).
          if (data.epgEntries && Array.isArray(data.epgEntries)) {
            epgEntries = data.epgEntries;
            epgMarkersStale = true;
            recomputeDvrMarkers();
          } else if (data.epgEntries === null) {
            epgEntries = [];
            recomputeDvrMarkers();
          }
          var epgStopMs = null;
          if (epgEntries.length && typeof parseEpgTime === 'function') {
            // parseEpgTime ist erst später im Script definiert (Function-Hoisting
            // deckt das ab); der Abruf läuft defensiv.
            var nowDate = new Date();
            for (var ei = 0; ei < epgEntries.length; ei++) {
              var eEntry = epgEntries[ei];
              var sMs = parseEpgTime(eEntry.start).getTime();
              var eMs = parseEpgTime(eEntry.stop).getTime();
              if (sMs <= nowDate.getTime() && eMs > nowDate.getTime()) { epgStopMs = eMs; break; }
            }
          }
          recChannelCtx.epgStopMs = epgStopMs;
          if (recMenu.classList.contains('open')) updateRecMenuItems();
          // U1: Bar-Modus-Signal vom Host ('on'|'off'|'auto') anwenden
          if (data.dvr === 'on' || data.dvr === 'off') {
            dvrBarMode = data.dvr;
            applyDvrBarMode();
          }
        } else if (data.type === 'recording-status') {
          // Snapshot der laufenden Aufnahmen (aktive + Remux) vom Host.
          applyRecordingState(data.status);
        } else if (data.type === 'recording-phase') {
          // Fix-Set 3 · Punkt 5: stopping → Chip-Beenden-Zustand, done → Snapshot
          // (Chip verschwindet, Bibliothek zeigt Konvertier-Status).
          var p = data.phase || {};
          if (p.recId && p.phase === 'stopping') {
            setRecStopping(p.recId, true);
            if (!(recordingStatus.active || []).length) {
              // Kein weiterer Snapshot: Chip bleibt offen mit Beenden-Zustand
              updateChipStopping(p.recId);
              stopRecTick();
            }
          } else if (p.recId && p.phase === 'done') {
            setRecStopping(p.recId, false);
            if (recMenu.classList.contains('open')) updateRecMenuItems();
          }
        }
      }

      window.addEventListener('streaming-hub-tv-command', function(e) {
        handleHostMessage(e.detail);
      });

      // Backward-compatible message listener for page-originated commands.
      // Origin-Check bewusstlos auf "gleiches Fenster" beschränkt (F-FB-07,
      // t_9372a4b3): file://-Guests haben origin "null" — ein Vergleich gegen
      // window.location.origin würde NIE matchen. Das Gate für Aktionen sitzt
      // im preload-content.js (Whitelist) und im Host (recorder-Validierung).
      window.addEventListener('message', function(e) {
        if (e.source !== window || !e.data) return;
        handleHostMessage(e.data);
      });

      // ── Show/hide controls overlay ──
      function showOverlay() {
        topOverlay.classList.add('visible');
        controls.classList.add('visible');
        clearTimeout(hideOverlayTimer);
        hideOverlayTimer = setTimeout(function() {
          if (isPlaying) {
            topOverlay.classList.remove('visible');
            controls.classList.remove('visible');
          }
        }, 3000);
      }

      function hideOverlay() {
        topOverlay.classList.remove('visible');
        controls.classList.remove('visible');
      }

      document.addEventListener('mousemove', showOverlay);
      document.addEventListener('keydown', showOverlay);
      video.addEventListener('mousemove', showOverlay);

      // ── Play/Pause ──
      function togglePlay() {
        if (video.paused) { video.play(); }
        else { video.pause(); }
      }

      function updatePlayState() {
        isPlaying = !video.paused;
        playIcon.style.display = video.paused ? 'block' : 'none';
        pauseIcon.style.display = video.paused ? 'none' : 'block';
      }

      playBtn.addEventListener('click', togglePlay);
      video.addEventListener('play', updatePlayState);
      video.addEventListener('pause', updatePlayState);

      // ── Time update ──
      function formatTime(t) {
        if (!t || !isFinite(t)) return '00:00';
        const h = Math.floor(t / 3600);
        const m = Math.floor((t % 3600) / 60);
        const s = Math.floor(t % 60);
        if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
        return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
      }

      video.addEventListener('timeupdate', function() {
        if (video.duration && isFinite(video.duration)) {
          progress.value = (video.currentTime / video.duration) * 100;
          timeEl.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration - video.currentTime);
        }
      });
      // DVR: DVR-Fenster auffrischen + Zeitanzeige relativ zur Live-Kante (Timeshift)
      video.addEventListener('timeupdate', function() {
        if (dvrState.enabled) {
          var wasLive = dvrState.isLive;
          dvrState.isLive = video.currentTime >= dvrState.windowEnd - 30;
          if (wasLive !== dvrState.isLive) updateLiveUi();
          var behind = Math.max(0, dvrState.windowEnd - video.currentTime);
          timeEl.textContent = formatTime(behind) + ' hinter Live' + (dvrState.isLive ? ' · LIVE' : ' · TIMESHIFT');
          if (epgMarkersStale) recomputeDvrMarkers();
        }
      });
      video.addEventListener('seeking', function() {
        if (dvrState.enabled) {
          var target = video.currentTime;
          dvrState.isLive = target >= dvrState.windowEnd - 30;
          updateLiveUi();
        }
      });
      video.addEventListener('timeupdate', function() { lastStallTime = Date.now(); });
      video.addEventListener('pause', function() { if (stallTimer) { clearInterval(stallTimer); stallTimer = null; } });

      progress.addEventListener('input', function() {
        if (!dvrState.enabled && video.duration && isFinite(video.duration)) {
          video.currentTime = (progress.value / 100) * video.duration;
        }
      });

      // ── Volume ──
      volumeSlider.addEventListener('input', function() {
        video.volume = volumeSlider.value;
        video.muted = false;
      });

      muteBtn.addEventListener('click', function() {
        video.muted = !video.muted;
      });

      video.addEventListener('volumechange', function() {
        volumeSlider.value = video.muted ? 0 : video.volume;
      });

      // ── Fullscreen ──
      fullscreenBtn.addEventListener('click', function() {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          document.body.requestFullscreen();
        }
      });

      // ── Keyboard shortcuts ──
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT') return;
        if (document.getElementById('tvChannelList').classList.contains('visible')) {
          resetChannelListTimer();
        }
        switch (e.key) {
          case ' ':
          case 'k': e.preventDefault(); togglePlay(); break;
          case 'f':
          case 'F': e.preventDefault(); fullscreenBtn.click(); break;
          case 'm':
          case 'M': e.preventDefault(); muteBtn.click(); break;
          case 'ArrowLeft': e.preventDefault(); if (dvrState.enabled) trySeek(video.currentTime - 10); else video.currentTime = Math.max(0, video.currentTime - 10); break;
          case 'ArrowRight': e.preventDefault(); if (dvrState.enabled) { if (!dvrState.isLive) trySeek(video.currentTime + 10); } else video.currentTime = Math.min(video.duration, video.currentTime + 10); break;
          case 'l':
          case 'L': if (dvrState.enabled) { e.preventDefault(); goLive(); } break;
          case 'r':
          case 'R': e.preventDefault(); recordBtn.click(); break;
          case '=':
          case '+': e.preventDefault(); video.volume = Math.min(1, video.volume + 0.1); break;
          case '-':
          case '_': e.preventDefault(); video.volume = Math.max(0, video.volume - 0.1); break;
        }
      });

      // ── Error ──
      // W2: Persistenter Fehlerdialog für tote Streams – bleibt sichtbar bis zur
      // nächsten Kanalwahl (statt nach 6s zu verschwinden), nennt den Sender und
      // weist auf den Senderwechsel hin (Pfeiltasten / Senderliste).
      function showFatalError(msg) {
        errorDiv.innerHTML =
          '<div style="font-size:24px;font-weight:600;margin-bottom:8px">' + msg + '</div>' +
          '<div style="font-size:15px;opacity:.85">Sender: ' + (channelNameEl.textContent || 'TV') +
          ' · Pfeiltasten ↑/↓ oder Senderliste (T) zum Wechseln</div>';
        errorDiv.style.whiteSpace = 'normal';
        errorDiv.style.display = 'block';
        clearTimeout(hideOverlayTimer);
        topOverlay.classList.add('visible');
        controls.classList.add('visible');
      }

      function showError(msg) {
        errorDiv.textContent = msg;
        errorDiv.style.whiteSpace = '';
        errorDiv.style.display = 'block';
        setTimeout(function() { errorDiv.style.display = 'none'; }, 6000);
      }

      // ── W2: Load-Watchdog ──
      // Bewaffnet sich SOFORT beim Kanalstart. Meldet nach STREAM_LOAD_TIMEOUT_MS
      // einen Fehler, solange kein Lebenszeichen (Canplay/Playing) kam.
      function armLoadWatchdog() {
        disarmLoadWatchdog();
        gotPlaybackSignal = false;
        hlsRecoverCount = 0;
        loadWatchdogTimer = setTimeout(function() {
          loadWatchdogTimer = null;
          if (gotPlaybackSignal) return;
          // W2: hls.js stoppen, damit keine startLoad()-Retruns mehr laufen
          if (hlsInstance) { try { hlsInstance.destroy(); } catch (e) {} hlsInstance = null; }
          loadingEl.style.display = 'none';
          showFatalError('Sender nicht erreichbar – Stream startet nicht');
        }, STREAM_LOAD_TIMEOUT_MS);
      }

      function disarmLoadWatchdog() {
        if (loadWatchdogTimer) { clearTimeout(loadWatchdogTimer); loadWatchdogTimer = null; }
      }

      function signalPlayback() {
        if (!gotPlaybackSignal) {
          gotPlaybackSignal = true;
          disarmLoadWatchdog();
        }
        // W2: jedes echte Lebenszeichen setzt die Recovery-Fehlerbilanz zurück –
        // erfolgreich wiederhergestellte Streamaussetzer zählen nicht weiter.
        hlsRecoverCount = 0;
      }

      // ── Audio track handling ──
      function parseAudioTracksFromManifest(str) {
        const tracks = [];
        const seen = {};
        const re = /#EXT-X-MEDIA:TYPE=AUDIO,([\s\S]+?)(?=#EXT-X-|\n|$)/g;
        let m;
        while ((m = re.exec(str)) !== null) {
          const attrs = {};
          m[1].split(',').forEach(function(p) {
            const eq = p.indexOf('=');
            if (eq > 0) attrs[p.slice(0, eq).trim()] = p.slice(eq + 1).trim().replace(/^"(.*)"$/, '$1');
          });
          const name = attrs.NAME;
          if (name && !seen[name]) {
            seen[name] = 1;
            tracks.push({ name: name, groupId: attrs['GROUP-ID'] || '', lang: attrs.LANGUAGE || '', 'default': attrs.DEFAULT === 'YES', uri: attrs.URI, hlsId: -1 });
          }
        }
        return tracks;
      }

      function setAudioTracks(newTracks) {
        if (!newTracks || !newTracks.length) return;
        audioTracks = newTracks;
        renderAudioTracks();
      }

      function renderAudioTracks() {
        var tracks = audioTracks.length ? audioTracks : [{ name: 'Standard' }];
        var hasReal = audioTracks.length > 0;
        audioWrap.style.display = '';
        audioDropdown.innerHTML = '';
        var activeIdx = hasReal ? 0 : -1;
        if (hlsInstance) { activeIdx = Math.max(0, hlsInstance.audioTrack); }
        else if (hasReal && video.audioTracks) {
          Array.from(video.audioTracks).some(function(at, ai) { if (at.enabled) { activeIdx = ai; return true; } });
        }
        tracks.forEach(function(t, i) {
          var isActive = activeIdx === i || (!hasReal && i === 0);
          var item = document.createElement('div');
          item.className = 'tv-audio-item' + (isActive ? ' active' : '');
          var trackLabel = t.name || 'Track ' + (i + 1);
          item.textContent = trackLabel;
          item.dataset.label = trackLabel;
          if (t.lang) item.textContent += ' (' + t.lang + ')';
          item.dataset.index = i;
          item.addEventListener('click', function(e) {
            e.stopPropagation();
            if (hlsInstance && hasReal) hlsInstance.audioTrack = i;
            else if (hasReal && video.audioTracks) Array.from(video.audioTracks).forEach(function(at, ai) { at.enabled = ai === i; });
            audioDropdown.querySelectorAll('.tv-audio-item').forEach(function(el) { el.classList.remove('active'); });
            item.classList.add('active'); audioBtn.textContent = '🔊 ' + (item.dataset.label || item.textContent.replace(/\s*\([^)]*\)\s*$/, '').trim()); audioDropdown.classList.remove('open');
          });
          audioDropdown.appendChild(item);
        });
        var activeTrack = activeIdx >= 0 && hasReal ? tracks[activeIdx] : tracks[0];
        audioBtn.textContent = '🔊 ' + (activeTrack ? activeTrack.name : 'Standard');
      }

      audioBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        audioDropdown.classList.toggle('open');
      });
      document.addEventListener('click', function() { audioDropdown.classList.remove('open'); });

      // Init volume
      video.volume = 0.5;
    })();
  </script>
</body>
</html>
