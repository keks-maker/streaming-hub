<!-- v0.3.10. – EPG-Titel escaped, hls.js-Fallback repariert, Listener-Leak behoben -->
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob: https:; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Player</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#000; overflow:hidden; height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Roboto,sans-serif;
    }
    video { width:100%; height:100%; object-fit:contain; display:block; }

    /* Top overlay (channel name) */
    .tv-top {
      position:fixed; top:16px; left:16px; right:auto;
      padding:12px 20px;
      background:rgba(0,0,0,0.6);
      border-radius:12px;
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      z-index:10;
      display:flex; align-items:center; gap:12px;
      opacity:0;
      pointer-events:none;
      transition:opacity .3s ease;
    }
    .tv-top.visible {
      opacity:1;
    }
    .tv-top-logo { width:40px; height:40px; border-radius:8px; object-fit:contain; }
    .tv-top-name { font-size:28px; font-weight:600; color:#f0f0f5; }
    /* U1: Im DVR-Modus ist die DVR-Scrub-Bar die einzige sichtbare Bar —
       der Legacy-Player-Progress-Balken wird per html.tv-dvr-mode ausgeblendet. */
    html.tv-dvr-mode .tv-progress {
      display: none;
    }
    .tv-epg-bar {
      text-align:center; padding:8px 16px; margin:0 0 8px;
      font-size:56px; color:#e2e8f0;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      display:none;
    }
    .tv-epg-bar .epg-time { color:#a78bfa; font-weight:600; }
    .tv-epg-bar .epg-title { color:#e2e8f0; }
    .tv-epg-bar .epg-next { color:#64748b; font-size:40px; }
    .tv-epg-bar .epg-sep { color:#475569; margin:0 14px; }

    /* Controls bar */
    .tv-controls {
      position:fixed; bottom:16px; left:16px; right:16px;
      padding:12px 16px 16px;
      background:rgba(0,0,0,0.6);
      border-radius:12px;
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      z-index:10;
      opacity:0;
      pointer-events:none;
      transition:opacity .3s ease;
    }
    .tv-controls.visible {
      opacity:1;
      pointer-events:auto;
    }

    .tv-controls-top {
      display:flex; align-items:center; gap:16px;
      padding:0 6px;
    }
    .tv-progress {
      flex:1; height:6px;
      -webkit-appearance:none; appearance:none;
      background:rgba(255,255,255,0.2); border-radius:3px;
      outline:none; cursor:pointer;
    }
    .tv-progress::-webkit-slider-thumb {
      -webkit-appearance:none; width:18px; height:18px;
      border-radius:50%; background:#a78bfa; border:none;
      cursor:pointer;
    }
    .tv-progress::-moz-range-thumb {
      width:18px; height:18px; border-radius:50%;
      background:#a78bfa; border:none; cursor:pointer;
    }

    .tv-controls-bottom {
      display:flex; align-items:center; gap:10px;
      margin-top:12px; padding:0 6px;
    }
    .tv-btn {
      width:44px; height:44px; border:none; background:transparent;
      color:rgba(255,255,255,0.7); border-radius:8px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:all .15s; flex-shrink:0;
    }
    .tv-btn:hover { background:rgba(255,255,255,0.1); color:#fff; }
    .tv-btn svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

    .tv-time {
      font-size:18px; font-weight:500; color:rgba(255,255,255,0.6);
      white-space:nowrap; font-variant-numeric:tabular-nums;
      min-width:120px; flex-shrink:0;
    }

    .tv-volume-wrap {
      display:flex; align-items:center; gap:6px;
      flex-shrink:0;
    }
    .tv-audio-wrap {
      position:relative; display:flex; align-items:center;
      flex-shrink:0;
    }
    .tv-audio-dropdown {
      position:absolute; bottom:100%; right:0; margin-bottom:6px;
      background:#1e1e2a; border:1px solid rgba(255,255,255,0.1);
      border-radius:10px; min-width:200px; max-height:280px; overflow-y:auto;
      display:none; z-index:20;
    }
    .tv-audio-dropdown.open { display:block; }
    .tv-audio-item {
      padding:10px 16px; font-size:16px; color:rgba(255,255,255,0.7);
      cursor:pointer; white-space:nowrap; transition:all .1s;
    }
    .tv-audio-item:hover { background:rgba(255,255,255,0.08); color:#fff; }
    .tv-audio-item.active { color:#a78bfa; font-weight:600; }
    .tv-volume-slider {
      width:100px; height:5px;
      -webkit-appearance:none; appearance:none;
      background:rgba(255,255,255,0.2); border-radius:3px;
      outline:none; cursor:pointer;
    }
    .tv-volume-slider::-webkit-slider-thumb {
      -webkit-appearance:none; width:14px; height:14px;
      border-radius:50%; background:#fff; border:none; cursor:pointer;
    }
    .tv-volume-slider::-moz-range-thumb {
      width:14px; height:14px; border-radius:50%;
      background:#fff; border:none; cursor:pointer;
    }
    .tv-spacer { flex:1; }

    /* DVR scrub bar (timeshift) */
    .tv-scrub-bar {
      position: relative;
      height: 18px; margin: 10px 8px 2px;
      display: none;
    }
    .tv-scrub-bar.visible { display: block; }
    .tv-scrub-track {
      position: absolute; left: 0; right: 0; top: 8px; height: 6px;
      background: rgba(255,255,255,0.15); border-radius: 3px;
      cursor: pointer;
    }
    .tv-scrub-track:hover .tv-scrub-viewport { box-shadow: 0 0 0 1px rgba(255,255,255,0.2); }
    .tv-scrub-viewport {
      position: absolute; top: 0; height: 100%;
      background: rgba(255,255,255,0.1); border-radius: 3px;
    }
    .tv-scrub-seekable {
      position: absolute; top: 0; height: 100%;
      background: rgba(167,139,250,0.35); border-radius: 3px;
    }
    .tv-scrub-played {
      position: absolute; top: 0; height: 100%;
      background: linear-gradient(to right, #7c3aed, #a78bfa);
      border-radius: 3px;
    }
    .tv-scrub-drag {
      position: absolute; top: -5px; width: 4px; height: 16px;
      background: #fff; border-radius: 2px; transform: translateX(-50%);
    }
    .tv-scrub-marker {
      position: absolute; top: 2px;
      width: 12px; height: 12px; margin-left: -6px;
      border-radius: 50%;
      background: #f59e0b;
      border: 2px solid #1e1e2a;
      cursor: pointer;
      z-index: 2;
      transition: transform .15s;
      /* U3: Container-Ebene hat pointer-events:none (Hit-Testing-Isolation
         vom laufenden In-place-Update); Marker reaktivieren sie explizit. */
      pointer-events: auto;
    }
    .tv-scrub-marker:hover { transform: scale(1.5); }
    .tv-scrub-marker .tv-scrub-tooltip {
      visibility: hidden; opacity: 0;
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #1e1e2a; border: 1px solid rgba(255,255,255,0.15);
      color: #f0f0f5; font-size: 13px; padding: 6px 10px; border-radius: 8px;
      white-space: nowrap; transition: opacity .15s; z-index: 5;
      pointer-events: none;
    }
    .tv-scrub-marker:hover .tv-scrub-tooltip { visibility: visible; opacity: 1; }
    .tv-live-badge { margin-left: 10px; display: none; }
    .tv-live-badge.visible { display: inline-flex; }

    /* Error */
    .tv-error {
      position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
      background:rgba(229,9,20,0.85); padding:16px 28px;
      border-radius:10px; font-size:20px; color:#fff;
      z-index:10; display:none; white-space:nowrap;
    }

    /* Loading spinner */
    .tv-loading {
      position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      width:56px; height:56px; border:4px solid rgba(255,255,255,0.1);
      border-top-color:#a78bfa; border-radius:50%;
      animation:spin .8s linear infinite; z-index:5;
    }
    @keyframes spin { to { transform:translate(-50%,-50%) rotate(360deg); } }

    /* Channel list overlay (right sidebar with slide-in) */
    .tv-channel-list {
      position: fixed; top: 80px; right: 4px; left: auto;
      z-index: 15; display: none;
      background: rgba(0,0,0,0.6);
      border-radius: 12px; padding: 6px;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      overflow: hidden;
      min-width: 300px; max-width: 360px;
      max-height: calc(100vh * 0.67);
      opacity: 0;
      transform: translateX(120px);
      transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }
    .tv-channel-list.visible {
      display: block;
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }
    .tv-channel-list-inner {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .tv-channel-item {
      display: flex; align-items: center; gap: 12px;
      padding: 6px 14px; margin: 2px 0;
      border-radius: 10px;
      color: rgba(255,255,255,0.35);
      overflow: hidden;
      min-height: 62px; box-sizing: border-box;
      font-size: 28px; font-weight: 500;
    }
    .tv-channel-item img {
      width: 40px; height: 40px; border-radius: 8px;
      object-fit: contain; flex-shrink: 0;
      background: rgba(255,255,255,0.06);
    }
    .tv-channel-info {
      display: flex; flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }
    .tv-channel-name {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tv-channel-epg {
      font-size: 18px; font-weight: 400;
      color: rgba(167,139,250,0.8);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      margin-top: 1px;
    }
    .tv-channel-item.active {
      background: rgba(167,139,250,0.15);
      color: #fff; font-weight: 700;
    }
  </style>
</head>
<body>
  <video id="tvVideo" autoplay playsinline></video>

  <div class="tv-loading" id="tvLoading"></div>

  <div class="tv-top" id="tvTop">
    <img class="tv-top-logo" id="tvTopLogo" alt="">
    <span class="tv-top-name" id="tvTopName">TV</span>
  </div>

  <div class="tv-controls" id="tvControls">
    <div class="tv-epg-bar" id="tvEpgBar"></div>
    <div class="tv-scrub-bar" id="tvScrubBar">
      <div class="tv-scrub-track" id="tvScrubTrack">
        <div class="tv-scrub-viewport" id="tvScrubViewport"></div>
        <div class="tv-scrub-seekable" id="tvScrubSeekable"></div>
        <div class="tv-scrub-played" id="tvScrubPlayed"></div>
        <div class="tv-scrub-drag" id="tvScrubDrag"></div>
      </div>
      <!-- U3: Marker-Container ist eine eigene absolute Ebene mit
           pointer-events:none; die Marker selbst reaktivieren pointer-events.
           So kann der Ticker style.left in-place aktualisieren, ohne Hit-Testing
           oder Hover zu stören. -->
      <div id="tvScrubMarkers" style="position:absolute; left:0; right:0; top:0; height:100%; pointer-events:none;"></div>
    </div>
    <div class="tv-controls-top">
      <input class="tv-progress" id="tvProgress" type="range" min="0" max="100" value="0">
    </div>
    <div class="tv-controls-bottom">
      <button class="tv-btn" id="tvRewindBtn" title="10s zurück (Pfeil links)" style="display:none">
        <svg viewBox="0 0 24 24"><polyline points="11,19 2,12 11,5"/><polyline points="22,19 13,12 22,5"/></svg>
      </button>
      <button class="tv-btn" id="tvPlayBtn" title="Play/Pause (Leertaste)">
        <svg viewBox="0 0 24 24" id="playIcon"><polygon points="6,4 20,12 6,20"/></svg>
        <svg viewBox="0 0 24 24" id="pauseIcon" style="display:none"><rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/></svg>
      </button>
      <button class="tv-btn" id="tvForwardBtn" title="10s vor (Pfeil rechts)" style="display:none">
        <svg viewBox="0 0 24 24"><polyline points="13,19 22,12 13,5"/><polyline points="2,19 11,12 2,5"/></svg>
      </button>
      <span class="tv-time" id="tvTime">00:00 / 00:00</span>
      <div class="tv-spacer"></div>
      <span class="tv-top-name" style="font-size:18px;color:rgba(255,255,255,0.5)" id="tvChannelName"></span>
      <div class="tv-spacer"></div>
      <div class="tv-volume-wrap">
        <button class="tv-btn" id="tvMuteBtn" title="Stumm (M)">
          <svg viewBox="0 0 24 24"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        </button>
        <input class="tv-volume-slider" id="tvVolume" type="range" min="0" max="1" step="0.05" value="0.5">
      </div>
      <div class="tv-audio-wrap" id="tvAudioWrap">
        <button class="tv-btn" id="tvAudioBtn" title="Audiospur">🔊</button>
        <div class="tv-audio-dropdown" id="tvAudioDropdown"></div>
      </div>
      <button class="tv-btn" id="tvLiveBtn" title="Zur Live-Kante (L)" style="display:none">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg>
      </button>
      <span class="tv-live-badge" id="tvLiveBadge" style="display:none;color:#10b981;font-size:13px;font-weight:700;padding:2px 8px;border:1px solid #10b981;border-radius:6px;">LIVE</span>
      <button class="tv-btn" id="tvFullscreenBtn" title="Vollbild (F)">
        <svg viewBox="0 0 24 24"><polyline points="15,3 21,3 21,9"/><polyline points="9,21 3,21 3,15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
    </div>
  </div>

  <div class="tv-channel-list" id="tvChannelList">
    <div class="tv-channel-list-inner" id="tvChannelListInner"></div>
  </div>

  <div class="tv-error" id="tvError"></div>

  <script>
    (function() {
      const video = document.getElementById('tvVideo');
      const topOverlay = document.getElementById('tvTop');
      const controls = document.getElementById('tvControls');
      const topName = document.getElementById('tvTopName');
      const topLogo = document.getElementById('tvTopLogo');
      const channelNameEl = document.getElementById('tvChannelName');
      const playBtn = document.getElementById('tvPlayBtn');
      const playIcon = document.getElementById('playIcon');
      const pauseIcon = document.getElementById('pauseIcon');
      const progress = document.getElementById('tvProgress');
      const timeEl = document.getElementById('tvTime');
      const volumeSlider = document.getElementById('tvVolume');
      const muteBtn = document.getElementById('tvMuteBtn');
      const fullscreenBtn = document.getElementById('tvFullscreenBtn');
      const errorDiv = document.getElementById('tvError');
      const loadingEl = document.getElementById('tvLoading');
      const audioWrap = document.getElementById('tvAudioWrap');
      const audioBtn = document.getElementById('tvAudioBtn');
      const audioDropdown = document.getElementById('tvAudioDropdown');
      const epgBar = document.getElementById('tvEpgBar');
      // ——— DVR / Timeshift elements ———
      const scrubBar = document.getElementById('tvScrubBar');
      const scrubTrack = document.getElementById('tvScrubTrack');
      const scrubViewport = document.getElementById('tvScrubViewport');
      const scrubSeekable = document.getElementById('tvScrubSeekable');
      const scrubPlayed = document.getElementById('tvScrubPlayed');
      const scrubDrag = document.getElementById('tvScrubDrag');
      const scrubMarkersEl = document.getElementById('tvScrubMarkers');
      const liveBtn = document.getElementById('tvLiveBtn');
      const liveBadge = document.getElementById('tvLiveBadge');
      const rewindBtn = document.getElementById('tvRewindBtn');
      const forwardBtn = document.getElementById('tvForwardBtn');

      let hideOverlayTimer = null;
      let isPlaying = false;
      let channelListData = null;
      let channelListIndex = -1;
      let channelListTimer = null;
      let hlsInstance = null;
      let audioTracks = [];
      let stallTimer = null;
      let lastStallTime = 0;
      let hlsLoaded = false;
      let channelGen = 0;
      let prevCanplay = null, prevWaiting = null, prevPlaying = null, prevError = null, prevLoadedMetadata = null;
      // ── W2: Fehlerdialog bei nie startendem Stream ──
      let loadWatchdogTimer = null;   // bewaffnet sich sofort beim Kanalstart (nicht erst nach 'playing')
      let gotPlaybackSignal = false;  // irgendein Lebenszeichen (manifest/canplay/playing)
      let hlsRecoverCount = 0;        // begrenzte hls.js-Recovery statt endlosem startLoad()
      const STREAM_LOAD_TIMEOUT_MS = 25000; // QA-Empfehlung 20–30s

      // ── DVR / Timeshift state ──
      // DVR-Fenster: [windowStart, windowEnd] in MEDIA-Sekunden (aus der Sliding-
      // Playlist via hls.js LevelDetails — NICHT aus video.seekable: seekable[0]
      // beginnt bei 0 und wächst mit der Session, das ist NICHT das DVR-Fenster).
      // pdtAnchor: { mediaSec, wallSec } = Anker MEDIA-Zeitachse ↔ Wall-Clock (UTC).
      let dvrState = {
        enabled: false,
        windowStart: 0,   // media seconds — ältester Fragmentstart im DVR-Fenster
        windowEnd: 0,     // media seconds — Live-Kante (Edge)
        isLive: true,
        markers: [],      // [{startMs, stopMs, title, origStartMs}]
        dragging: false,
      };
      let epgEntries = [];    // raw EPG for current channel (from host)
      let epgMarkersStale = true;
      function tvDiagnostic(type, data) {
        try { window.postMessage({ source: 'tv-diagnostic', type: type, data: data || {} }, window.location.origin); } catch (_) {}
      }
      const DVR_MIN_SEEKABLE = 900; // Sekunden Playlist-Fenster; Scrub-UI enabler (Orchestrator decision)
      // U1: Bar-Exklusivität. dvrBarMode ('auto' | 'on' | 'off') kommt vom Host
      // (renderer.js dvrBarMode()); 'off' zwingt die Legacy-Bar. Default 'auto':
      // DVR an => DVR-Bar, Legacy-Bar aus (display:none via html.tv-dvr-mode);
      // kein DVR => exakt das alte Verhalten.
      let dvrBarMode = 'auto';
      // U3: Hover-Schutzfenster — nach dem letzten echten pointerleave auf
      // .tv-scrub-marker bleibt der Marker-Rebuild bis Ablauf eingefroren,
      // damit auch echte Rebuilds (Marker-Menge hat sich geändert) den Tooltip
      // nicht im Millisekundentakt zerstören. Ebenso während aktivem Drag.
      var markerHoverGuardUntil = 0;
      var pointerOverMarker = false;

      // Load HLS.js dynamically. A file:// webview cannot resolve the package
      // from the repository root reliably, so try the page-local path first
      // and then the absolute path supplied by the host renderer.
      function loadHlsJs(cb) {
        if (hlsLoaded) { if (cb) cb(); return; }
        var base = window.location.href.split('?')[0];
        var dir = base.substring(0, base.lastIndexOf('/') + 1);
        var candidates = [
          dir + 'node_modules/hls.js/dist/hls.min.js',
          dir + '../../../../node_modules/hls.js/dist/hls.min.js',
        ];
        if (window.__streamingHubHlsPath) candidates.push(window.__streamingHubHlsPath);
        var index = 0;
        function tryNext() {
          if (index >= candidates.length) {
            console.error('hls.js konnte nicht geladen werden', candidates);
            console.warn('Fallback auf native Wiedergabe');
            hlsLoaded = true;
            if (cb) cb();
            return;
          }
          var s = document.createElement('script');
          s.onload = function() { hlsLoaded = true; if (cb) cb(); };
          s.onerror = function() {
            s.remove();
            index += 1;
            tryNext();
          };
          s.src = candidates[index++];
          document.head.appendChild(s);
        }
        tryNext();
      }

      // ── U1: Bar-Exklusivität im DVR-Modus ──
      function applyDvrBarMode() {
        if (dvrBarMode === 'on') {
          // Host zwingt die DVR-Bar an (auch ohne DVR-Fenster: leere Bar mit
          // LIVE-Button als Kapazitäts-Reserve für spätere Features).
          dvrState.enabled = true;
          document.documentElement.classList.add('tv-dvr-mode');
          scrubBar.classList.add('visible');
          liveBtn.style.display = '';
          rewindBtn.style.display = '';
          forwardBtn.style.display = '';
          updateLiveUi();
          epgMarkersStale = true;
          return;
        }
        if (dvrBarMode === 'off') {
          // Host zwingt die Legacy-Bar: DVR-UI komplett aus, Legacy-Bar bleibt
          // sichtbar (html.tv-dvr-mode wird nie gesetzt).
          resetDvrState();
          document.documentElement.classList.remove('tv-dvr-mode');
          return;
        }
        // 'auto': Legacy-Bar nur im DVR-Modus verstecken (U1), sonst unverändert.
        if (dvrState.enabled) document.documentElement.classList.add('tv-dvr-mode');
        else document.documentElement.classList.remove('tv-dvr-mode');
      }

      // ── EPG update (ohne Rest des Channels zu berühren) ──
      function updateEpgBar(epg, start, end, next) {
        if (!epg) {
          epgBar.style.display = 'none';
          return;
        }
        epgBar.replaceChildren();
        function addText(className, text) {
          var node = document.createElement('span');
          node.className = className;
          node.textContent = text || '';
          epgBar.appendChild(node);
        }
        addText('epg-time', start);
        addText('epg-sep', '–');
        addText('epg-time', end);
        addText('epg-sep', '·');
        addText('epg-title', epg);
        if (next) {
          addText('epg-sep', '|');
          addText('epg-next', next);
        }
        epgBar.style.display = 'block';
      }

      // ── EPG-Polling: Host um aktuelle EPG-Daten bitten ──
      var epgPollTimer = null;
      // parseEpgTime (XMLTV "20260908143000 +0200" → Date) — lokal, entspricht typed-core epg.ts
      function parseEpgTime(timeStr) {
        var m = timeStr.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\s*([+-]\d{2})(\d{2})/);
        if (m) {
          var utc = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
          var tzOffset = (+m[7]) * 60 + (+m[8]);
          return new Date(utc - tzOffset * 60000);
        }
        var m2 = timeStr.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/);
        if (!m2) return new Date(0);
        return new Date(Date.UTC(+m2[1], +m2[2] - 1, +m2[3], +m2[4], +m2[5], +m2[6]));
      }
      function startEpgPolling() {
        stopEpgPolling();
        epgPollTimer = setInterval(function() {
          window.postMessage({ source: 'tv-player', action: 'request-epg' }, window.location.origin);
        }, 30000); // alle 30 Sekunden
      }
      function stopEpgPolling() {
        if (epgPollTimer) { clearInterval(epgPollTimer); epgPollTimer = null; }
      }

      // ═════════ DVR / Timeshift ═════════
      // Fensterbreite immer aus dem Stream lesen (Orchestrator-Decision 1+2):
      // hls.js LevelDetails (fragmentStart … edge) = echtes DVR-Fenster der
      // Sliding-Playlist, senderabhängig (Das Erste 7200s, NDR 3600s, …).
      // Aktivierung ab DVR_MIN_SEEKABLE; ohne DVR-Fenster exakt heutiges Verhalten.

      function resetDvrState() {
        dvrState.enabled = false;
        dvrState.windowStart = 0;
        dvrState.windowEnd = 0;
        dvrState.isLive = true;
        dvrState.markers = [];
        dvrState.dragging = false;
        epgEntries = [];
        epgMarkersStale = true;
        scrubBar.classList.remove('visible');
        liveBtn.style.display = 'none';
        liveBadge.style.display = 'none';
        rewindBtn.style.display = 'none';
        forwardBtn.style.display = 'none';
        scrubMarkersEl.innerHTML = '';
        // U1: Legacy-Bar wieder sichtbar lassen (Klasse nur im DVR-Modus aktiv)
        document.documentElement.classList.remove('tv-dvr-mode');
      }

      // Aus LevelDetails (LEVEL_LOADED/LEVEL_UPDATED): DVR-Fenster lesen.
      // details.fragmentStart = ältester Fragmentstart, details.edge = Live-Kante.
      function updateDvrFromLevelDetails(details) {
        if (!details || !details.live) return;
        var fragStart = details.fragmentStart;
        var edge = details.edge;
        if (!isFinite(fragStart) || !isFinite(edge) || edge - fragStart <= 0) return;
        var span = edge - fragStart;
        if (span >= DVR_MIN_SEEKABLE) {
          if (!dvrState.enabled) {
            dvrState.enabled = true;
            scrubBar.classList.add('visible');
            liveBtn.style.display = '';
            rewindBtn.style.display = '';
            forwardBtn.style.display = '';
            updateLiveUi();
            // U1: DVR-Modus aktiv → Legacy-Balken ausblenden (Klasse steuert CSS)
            applyDvrBarMode();
          }
          dvrState.windowStart = fragStart;
          dvrState.windowEnd = edge;
          epgMarkersStale = true;
        } else if (dvrState.enabled && dvrBarMode !== 'on') {
          // Stream hat DVR-Fenster verloren. U1: bei erzwungenem 'on'-Modus
          // bleibt die Bar trotzdem an (Host-Entscheidung hat Vorrang).
          resetDvrState();
        }
      }

      function updateLiveUi() {
        liveBtn.style.display = dvrState.enabled ? '' : 'none';
        liveBadge.style.display = dvrState.enabled && dvrState.isLive ? '' : 'none';
      }

      // Wall-clock anchor: PROGRAM-DATE-TIME-Mapping MEDIA-Zeitachse ↔ UTC.
      // Wird bei jedem Playlist-Update auf den frühesten PDT-Fragment gesetzt.
      var pdtAnchor = null; // { mediaSec, wallSec }
      function updatePdtFromLevelDetails(details) {
        if (details && details.fragments && details.fragments.length) {
          for (var i = 0; i < details.fragments.length; i++) {
            var f = details.fragments[i];
            if (f.programDateTime) {
              pdtAnchor = {
                mediaSec: f.start,
                wallSec: new Date(f.programDateTime).getTime() / 1000,
              };
              break;
            }
          }
        }
      }

      function mediaSecToWallSec(mediaSec) {
        if (pdtAnchor == null) return null;
        return pdtAnchor.wallSec + (mediaSec - pdtAnchor.mediaSec);
      }

      // Marker aus epgEntries berechnen, sobald Fenster + PDT bekannt
      function recomputeDvrMarkers() {
        if (!dvrState.enabled || pdtAnchor == null || !epgEntries.length) {
          tvDiagnostic('marker-prerequisites', {
            dvr: dvrState.enabled,
            pdt: !!pdtAnchor,
            epgEntries: epgEntries.length,
            windowStart: dvrState.windowStart,
            windowEnd: dvrState.windowEnd,
          });
          dvrState.markers = [];
          renderScrubMarkers();
          return;
        }
        var winStartWall = mediaSecToWallSec(dvrState.windowStart) * 1000;
        var winEndWall = mediaSecToWallSec(dvrState.windowEnd) * 1000;
        if (!isFinite(winStartWall) || !isFinite(winEndWall)) {
          tvDiagnostic('marker-invalid-window', { winStartWall: winStartWall, winEndWall: winEndWall });
          dvrState.markers = [];
          renderScrubMarkers();
          return;
        }
        var out = [];
        for (var i = 0; i < epgEntries.length; i++) {
          var e = epgEntries[i];
          var sMs = parseEpgTime(e.start).getTime();
          var eMs = parseEpgTime(e.stop).getTime();
          if (!sMs || !eMs) continue;
          if (sMs < winEndWall && eMs > winStartWall) {
            out.push({ title: e.title, startMs: Math.max(sMs, winStartWall), stopMs: eMs, origStartMs: sMs });
          }
        }
        dvrState.markers = out;
        tvDiagnostic('markers-computed', {
          dvr: dvrState.enabled,
          pdt: !!pdtAnchor,
          epgEntries: epgEntries.length,
          markers: out.length,
          windowStart: dvrState.windowStart,
          windowEnd: dvrState.windowEnd,
        });
        renderScrubMarkers();
      }

      // ── U3: Marker-DOM in-place synchronisieren ──
      // Baut die Marker-Elemente NICHT periodisch neu (das zerstörte gehovertes
      // DOM und flackerte den Tooltip im Millisekundentakt), sondern hält die
      // Kind-Elemente stabil und aktualisiert nur Position/Tooltip in-place.
      function markerTooltipText(m) {
        var sd = new Date(m.origStartMs);
        return m.title + ' · ' + ('0' + sd.getHours()).slice(-2) + ':' + ('0' + sd.getMinutes()).slice(-2);
      }

      function syncDvrMarkers() {
        if (!dvrState.enabled) {
          if (scrubMarkersEl.firstChild) scrubMarkersEl.innerHTML = '';
          return;
        }
        var winStartWallMs = mediaSecToWallSec(dvrState.windowStart) * 1000;
        var winEndWallMs = mediaSecToWallSec(dvrState.windowEnd) * 1000;
        var spanWallMs = winEndWallMs - winStartWallMs;
        if (!isFinite(spanWallMs) || spanWallMs <= 0) {
          if (scrubMarkersEl.firstChild) scrubMarkersEl.innerHTML = '';
          return;
        }
        var markers = dvrState.markers || [];
        // Rebuild nur, wenn die Marker-MENGE sich geändert hat UND kein
        // Hover-Schutzfenster aktiv ist (U3: gehovertes Element nicht zerstören).
        if (scrubMarkersEl.childElementCount !== markers.length && Date.now() >= markerHoverGuardUntil) {
          scrubMarkersEl.innerHTML = '';
          for (var j = 0; j < markers.length; j++) {
            var el0 = document.createElement('div');
            el0.className = 'tv-scrub-marker';
            var tip0 = document.createElement('div');
            tip0.className = 'tv-scrub-tooltip';
            el0.appendChild(tip0);
            (function(markerRef) {
              el0.addEventListener('click', function(ev) {
                ev.stopPropagation();
                seekToWallMs(markerRef.origStartMs);
              });
            })(markers[j]);
            scrubMarkersEl.appendChild(el0);
          }
        }
        // In-place: Position + Tooltip-Text der bestehenden Elemente aktualisieren.
        var children = scrubMarkersEl.children;
        for (var i = 0; i < children.length; i++) {
          var m = markers[i];
          var el = children[i];
          if (!m) { el.style.display = 'none'; continue; }
          var pct = ((m.startMs - winStartWallMs) / spanWallMs) * 100;
          if (!isFinite(pct)) { el.style.display = 'none'; continue; }
          pct = Math.max(0, Math.min(100, pct));
          el.style.display = '';
          el.style.left = pct + '%';
          el.dataset.origStartMs = String(m.origStartMs);
          var tip = el.firstChild;
          var text = markerTooltipText(m);
          if (tip && tip.textContent !== text) tip.textContent = text;
        }
      }

      function renderScrubMarkers() {
        syncDvrMarkers();
      }

      function seekToWallMs(wallMs) {
        if (!dvrState.enabled || pdtAnchor == null) return;
        var winStartWallMs = mediaSecToWallSec(dvrState.windowStart) * 1000;
        var winEndWallMs = mediaSecToWallSec(dvrState.windowEnd) * 1000;
        var clamped = Math.max(winStartWallMs, Math.min(winEndWallMs, wallMs));
        var mediaSec = pdtAnchor.mediaSec + (clamped / 1000 - pdtAnchor.wallSec);
        trySeek(mediaSec);
      }

      function trySeek(mediaSec) {
        if (!isFinite(mediaSec)) return;
        var edge = hlsInstance ? hlsInstance.liveSyncPosition : dvrState.windowEnd;
        if (!isFinite(edge)) edge = dvrState.windowEnd;
        // An der Live-Kante nur bis zum letzten intakten Fragment (Target Duration Puffer)
        mediaSec = Math.max(dvrState.windowStart, Math.min(edge - 4, mediaSec));
        dvrState.isLive = mediaSec >= edge - 30; // within 30s of edge = live
        video.currentTime = mediaSec;
        updateLiveUi();
        renderScrub();
      }

      function goLive() {
        if (!dvrState.enabled || !hlsInstance) return;
        dvrState.isLive = true;
        // Sauber an die Live-Kante: hls.js berechnet liveSyncPosition (Edge minus
        // Ziel-Latenz) und setzt currentTime selbst, wenn currentTime dort liegt.
        var target = hlsInstance.liveSyncPosition;
        if (!isFinite(target)) target = dvrState.windowEnd - 4;
        video.currentTime = target;
        if (video.paused) video.play();
        updateLiveUi();
        renderScrub();
      }

      function renderScrub() {
        if (!dvrState.enabled) return;
        var span = dvrState.windowEnd - dvrState.windowStart;
        if (span <= 0) return;
        // Track = DVR-Fenster [windowStart, windowEnd] (Media-Sekunden)
        scrubViewport.style.left = '0%';
        scrubViewport.style.width = '100%';
        // Zeiger = aktuelle Wiedergabeposition
        var pos = video.currentTime;
        var posPct = ((pos - dvrState.windowStart) / span) * 100;
        posPct = Math.max(0, Math.min(100, posPct));
        scrubPlayed.style.left = '0%';
        scrubPlayed.style.width = posPct + '%';
        scrubDrag.style.left = posPct + '%';
        // Marker layout stale?
        if (epgMarkersStale) { epgMarkersStale = false; recomputeDvrMarkers(); }
        // U3: Marker-Positionen in-place ans gleitende DVR-Fenster anpassen
        // (kein Rebuild — DOM-Identität/Hover bleibt stabil).
        else syncDvrMarkers();
      }

      // Klick/ Drag auf Track
      scrubTrack.addEventListener('click', function(ev) {
        if (!dvrState.enabled || dvrState.dragging) return;
        var rect = scrubTrack.getBoundingClientRect();
        var pct = (ev.clientX - rect.left) / rect.width;
        var mediaSec = dvrState.windowStart + pct * (dvrState.windowEnd - dvrState.windowStart);
        trySeek(mediaSec);
      });
      scrubTrack.addEventListener('mousedown', function(ev) {
        dvrState.dragging = true;
        // U3: während aktivem Drag keine Marker-Rebuilds (DOM darf nicht unter
        // der Maus weggeräumt werden); Freigabe im upHandler.
        markerHoverGuardUntil = Date.now() + 60000;
        var moveHandler = function(ev2) {
          var rect = scrubTrack.getBoundingClientRect();
          var pct = (ev2.clientX - rect.left) / rect.width;
          var mediaSec = dvrState.windowStart + pct * (dvrState.windowEnd - dvrState.windowStart);
          scrubDrag.style.left = Math.max(0, Math.min(100, pct)) + '%';
          trySeek(mediaSec);
        };
        var upHandler = function() {
          dvrState.dragging = false;
          markerHoverGuardUntil = pointerOverMarker ? Date.now() + 60000 : 0;
          document.removeEventListener('mousemove', moveHandler);
          document.removeEventListener('mouseup', upHandler);
        };
        document.addEventListener('mousemove', moveHandler);
        document.addEventListener('mouseup', upHandler);
      });
      // U3: Hover-Schutzfenster. pointerover/-out bubbeln vom Marker durch den
      // pointer-events:none-Container (der Listener überlebt Marker-Rebuilds).
      // Solange der Schutz aktiv ist, friert syncDvrMarkers Rebuilds ein;
      // Positions-/Tooltip-Updates laufen in-place weiter.
      scrubMarkersEl.addEventListener('pointerover', function(ev) {
        if (ev.target && ev.target.closest && ev.target.closest('.tv-scrub-marker')) {
          pointerOverMarker = true;
          markerHoverGuardUntil = Date.now() + 60000;
        }
      });
      scrubMarkersEl.addEventListener('pointerout', function(ev) {
        if (ev.target && ev.target.closest && ev.target.closest('.tv-scrub-marker')) {
          pointerOverMarker = false;
          // Kurzer Übergangs-Tail (Tooltip-Fade .15s), dann sind Rebuilds
          // wieder freigegeben — neue Marker verzögern sich nicht merklich.
          markerHoverGuardUntil = Date.now() + 300;
        }
      });
      liveBtn.addEventListener('click', function(ev) { ev.stopPropagation(); goLive(); });
      rewindBtn.addEventListener('click', function(ev) {
        ev.stopPropagation();
        if (dvrState.enabled) trySeek(video.currentTime - 10);
      });
      forwardBtn.addEventListener('click', function(ev) {
        ev.stopPropagation();
        if (dvrState.enabled && !dvrState.isLive) trySeek(video.currentTime + 10);
      });

      // Zeit-Update: Scrub + Rest-Zeit live ajustieren
      setInterval(function() {
        if (dvrState.enabled && !dvrState.dragging) {
          // DVR-Fenster zwischen den hls.js-Playlist-Events auffrischen
          if (hlsInstance && hlsInstance.latestLevelDetails) updateDvrFromLevelDetails(hlsInstance.latestLevelDetails);
          // isLive check: currentTime within 30s of live edge
          var wasLive = dvrState.isLive;
          dvrState.isLive = video.currentTime >= dvrState.windowEnd - 30;
          if (wasLive !== dvrState.isLive) updateLiveUi();
          renderScrub();
        }
      }, 250);

      // ── Channel list overlay ──
      function esc(str) { return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

      function showChannelList(channels, currentIdx) {
        channelListData = channels;
        channelListIndex = currentIdx;
        var container = document.getElementById('tvChannelList');
        var inner = document.getElementById('tvChannelListInner');

        if (!channels || !channels.length) { container.classList.remove('visible'); return; }

        inner.replaceChildren();
        channels.forEach(function(ch, i) {
          var item = document.createElement('div');
          item.className = 'tv-channel-item' + (i === currentIdx ? ' active' : '');
          var info = document.createElement('div');
          info.className = 'tv-channel-info';
          var name = document.createElement('span');
          name.className = 'tv-channel-name';
          name.textContent = ch.name || '';
          info.appendChild(name);
          if (ch.epg) {
            var epg = document.createElement('span');
            epg.className = 'tv-channel-epg';
            epg.textContent = ch.epg;
            info.appendChild(epg);
          }
          if (ch.logo) {
            try {
              var logoUrl = new URL(ch.logo, document.baseURI);
              if (logoUrl.protocol === 'http:' || logoUrl.protocol === 'https:') {
                var logo = document.createElement('img');
                logo.src = logoUrl.toString();
                logo.alt = '';
                logo.loading = 'lazy';
                item.appendChild(logo);
              }
            } catch (_) {}
          }
          item.appendChild(info);
          inner.appendChild(item);
        });

        container.classList.add('visible');
        inner.offsetHeight;

        var firstItem = inner.firstElementChild;
        var itemHeight = firstItem ? firstItem.offsetHeight + parseFloat(getComputedStyle(firstItem).marginTop) + parseFloat(getComputedStyle(firstItem).marginBottom) : 66;
        var maxAvailHeight = window.innerHeight * 0.67 - 18;
        var visibleCount = Math.min(channels.length, Math.max(4, Math.floor(maxAvailHeight / itemHeight)));
        var containerHeight = visibleCount * itemHeight;
        container.style.height = (containerHeight + 18) + 'px';

        var half = (visibleCount - 1) / 2;
        var targetScroll = currentIdx * itemHeight - half * itemHeight;
        var maxScroll = Math.max(0, channels.length * itemHeight - containerHeight);
        var clamped = Math.max(0, Math.min(targetScroll, maxScroll));
        inner.style.transform = 'translateY(' + (-clamped) + 'px)';

        resetChannelListTimer();
      }

      function resetChannelListTimer() {
        clearTimeout(channelListTimer);
        channelListTimer = setTimeout(function() {
          document.getElementById('tvChannelList').classList.remove('visible');
        }, 4000);
      }

      function hideChannelList() {
        clearTimeout(channelListTimer);
        document.getElementById('tvChannelList').classList.remove('visible');
      }

      // ── Reusable channel setup ──
      function safeHttpUrl(value) {
        if (typeof value !== 'string' || !value.trim()) return '';
        try {
          var parsed = new URL(value, document.baseURI);
          if (parsed.username || parsed.password) return '';
          return parsed.protocol === 'http:' || parsed.protocol === 'https:' ? parsed.toString() : '';
        } catch (_) {
          return '';
        }
      }

      function setupChannel(url, name, logo, epg, start, end, next) {
        tvDiagnostic('setup-channel', { name: name || '', url: url || '' });
        channelGen++;
        var gen = channelGen;
        var savedVolume = video.volume;
        var savedMuted = video.muted;
        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
        video.pause();
        video.removeAttribute('src');
        video.load();
        video.volume = savedVolume;
        video.muted = savedMuted;
        loadingEl.style.display = 'block';
        errorDiv.style.display = 'none';
        errorDiv.style.whiteSpace = '';
        audioTracks = [];
        audioDropdown.innerHTML = '';
        audioWrap.style.display = 'none';

        // W2: Load-Watchdog sofort scharf schalten (vorher: erst nach 'playing',
        // wodurch tote Streams endlos im Ladezustand hingen)
        armLoadWatchdog();

        // DVR reset on channel switch (Orchestrator-Decision 4: kein Positions-Persisting)
        resetDvrState();
        // U1: Bar-Modus pro Kanal zurücksetzen; Host darf ihn via
        // switch-channel/epg-update überschreiben (dvr: 'on'|'off'|'auto').
        dvrBarMode = 'auto';

        const channelName = typeof name === 'string' ? name : 'TV';
        const channelLogo = safeHttpUrl(logo);

        topName.textContent = channelName;
        channelNameEl.textContent = channelName;

        updateEpgBar(epg, start, end, next);
        startEpgPolling();

        if (channelLogo) { topLogo.src = channelLogo; topLogo.style.display = 'block'; }
        else { topLogo.style.display = 'none'; }

        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: 'TV: ' + channelName,
            artist: 'Streaming Hub',
            album: 'TV',
            artwork: channelLogo ? [{ src: channelLogo, sizes: '256x256', type: 'image/png' }] : [],
          });
        }

        if (!url) {
          tvDiagnostic('setup-invalid-url', { reason: 'missing' });
          disarmLoadWatchdog(); // W2: sofortige Meldung genügt, kein Watchdog nötig
          showError('Keine Stream-URL');
          loadingEl.style.display = 'none';
          return;
        }

        let decodedUrl;
        try {
          decodedUrl = safeHttpUrl(decodeURIComponent(url));
        } catch (_) {
          decodedUrl = '';
        }
        if (!decodedUrl) {
          tvDiagnostic('setup-invalid-url', { reason: 'invalid' });
          disarmLoadWatchdog();
          showError('Ungültige Stream-URL');
          loadingEl.style.display = 'none';
          return;
        }

        if (prevCanplay) video.removeEventListener('canplay', prevCanplay);
        if (prevWaiting) video.removeEventListener('waiting', prevWaiting);
        if (prevPlaying) video.removeEventListener('playing', prevPlaying);
        if (prevError) video.removeEventListener('error', prevError);
        if (prevLoadedMetadata) video.removeEventListener('loadedmetadata', prevLoadedMetadata);
        if (stallTimer) { clearInterval(stallTimer); stallTimer = null; }

        prevCanplay = function() {
          loadingEl.style.display = 'none';
          signalPlayback(); // W2: Lebenszeichen entwaffnet den Load-Watchdog
          showOverlay();
        };
        prevWaiting = function() {
          loadingEl.style.display = 'block';
          lastStallTime = Date.now();
        };
        prevPlaying = function() {
          tvDiagnostic('playing', { name: channelName });
          loadingEl.style.display = 'none';
          signalPlayback(); // W2
          if (stallTimer) clearInterval(stallTimer);
          lastStallTime = Date.now();
          stallTimer = setInterval(function() {
            if (video.paused || video.ended) return;
            if (video.readyState < 2) return;
            if (Date.now() - lastStallTime > 15000) {
              showError('Stream hängt – keine Daten für 15s');
              if (stallTimer) clearInterval(stallTimer);
            }
          }, 3000);
        };
        prevError = function() {
          tvDiagnostic('video-error', { name: channelName, code: video.error && video.error.code });
          loadingEl.style.display = 'none';
          disarmLoadWatchdog();
          // W2: fatale Native-Player-Fehler gehören zum persistenten Dialog
          // (statt der 6s-Meldung, die den User allein lässt)
          showFatalError('Stream-Wiedergabe fehlgeschlagen');
        };

        video.addEventListener('canplay', prevCanplay);
        video.addEventListener('waiting', prevWaiting);
        video.addEventListener('playing', prevPlaying);
        video.addEventListener('error', prevError);

        try {
          var initHls = function() {
            pdtAnchor = null; // PDT-Anker ist kanalspezifisch
            if (typeof Hls === 'undefined' || !Hls.isSupported()) {
              video.src = decodedUrl;
              // Listener merken und bei Kanalwechsel entfernen (sonst akkumulieren sie)
              prevLoadedMetadata = function() {
                var nt = video.audioTracks;
                if (nt && nt.length) {
                  setAudioTracks(Array.from(nt).map(function(t, i) { return { name: t.label || 'Track ' + (i+1), lang: t.language, id: i }; }));
                } else { renderAudioTracks(); }
              };
              video.addEventListener('loadedmetadata', prevLoadedMetadata);
              return;
            }
            const hls = new Hls({
              enableWorker: false,
              maxBufferLength: 15,
              liveSyncDurationCount: 3,
              // Snapback: liveMaxLatencyDurationCount bewusst NICHT gesetzt.
              // hls.js-Default ist Infinity => der stream-controller sucht nie selbst
              // zur Live-Kante zurück ("Playback: ... is located too far from the
              // end of live sliding playlist"), egal wie weit hinten wir stehen.
              // Rückkehr zur Live-Kante nur explizit via goLive() (Orchestrator-Decision 3).
              // (liveMaxLatencyDurationCount: 30 snapbackt bei 2s-Segmenten bereits nach 60s.)
              subtitleTrackController: null,
            });
            hlsInstance = hls;
            hls.on(Hls.Events.DESTROYING, function() { if (hlsInstance === hls) hlsInstance = null; });
            hls.on(Hls.Events.LEVEL_LOADED, function(_event, data) {
              if (gen !== channelGen) return;
              updatePdtFromLevelDetails(data.details);
              // DVR sentinel: DVR-Fenster aus der Sliding-Playlist lesen
              updateDvrFromLevelDetails(data.details);
              tvDiagnostic('hls-level', {
                event: 'LEVEL_LOADED',
                live: !!(data.details && data.details.live),
                fragmentStart: data.details && data.details.fragmentStart,
                edge: data.details && data.details.edge,
                dvr: dvrState.enabled,
                pdt: !!pdtAnchor,
                epgEntries: epgEntries.length,
                markers: dvrState.markers.length,
              });
              recomputeDvrMarkers();
            });
            hls.on(Hls.Events.LEVEL_UPDATED, function(_event, data) {
              if (gen !== channelGen) return;
              updatePdtFromLevelDetails(data.details);
              updateDvrFromLevelDetails(data.details);
              tvDiagnostic('hls-level', {
                event: 'LEVEL_UPDATED',
                live: !!(data.details && data.details.live),
                fragmentStart: data.details && data.details.fragmentStart,
                edge: data.details && data.details.edge,
                dvr: dvrState.enabled,
                pdt: !!pdtAnchor,
                epgEntries: epgEntries.length,
                markers: dvrState.markers.length,
              });
              recomputeDvrMarkers();
            });
            tvDiagnostic('hls-start', { name: channelName, url: decodedUrl });
            hls.loadSource(decodedUrl);
            hls.attachMedia(video);
            fetch(decodedUrl).then(function(r) { return r.text(); }).then(function(txt) {
              var parsed = parseAudioTracksFromManifest(txt);
              if (parsed.length && !audioTracks.length) setAudioTracks(parsed);
            }).catch(function() {});
            hls.on(Hls.Events.MANIFEST_LOADED, function(_event, data) {
              hlsInstance = hls;
              if (!audioTracks.length) {
                if (data.audioTracks && data.audioTracks.length) {
                  setAudioTracks(data.audioTracks);
                } else if (data.url) {
                  fetch(data.url).then(function(r) { return r.text(); }).then(function(txt) {
                    var parsed = parseAudioTracksFromManifest(txt);
                    if (parsed.length && !audioTracks.length) setAudioTracks(parsed);
                  }).catch(function() {});
                }
              }
            });
            hls.on(Hls.Events.MANIFEST_PARSED, function(_event, data) {
              hlsInstance = hls;
              if (data.audioTracks && data.audioTracks.length && !audioTracks.length) {
                setAudioTracks(data.audioTracks);
              }
              video.play().catch(function() {
                if (gen !== channelGen) return;
                video.muted = true;
                video.play().catch(function() {});
              });
            });
            // W2: Kein Reset des Recovery-Zählers bei MANIFEST_LOADED –
            // signalPlayback() (canplay/playing) ist der einzige legitime Reset,
            // sonst würden sich Manifest-OK/Segmente-tot-Zyklen endlos retryen.
            hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, function() {
              if (hlsInstance) {
                var t = hlsInstance.audioTracks || hlsInstance.allAudioTracks || [];
                if (t && t.length) setAudioTracks(t);
              }
            });
            hls.on(Hls.Events.ERROR, function(_event, data) {
              if (gen !== channelGen) return;
              tvDiagnostic('hls-error', { name: channelName, fatal: !!data.fatal, type: data.type || '', details: data.details || '' });
              if (data.fatal) {
                // W2: fatale hls.js-Fehler zählen strike-weise. Nach 4 Strikes ohne
                // erfolgreiches Lebenszeichen (canplay/playing setzt zurück) wird
                // nicht mehr endlos gestartet, sondern der persistente Dialog gezeigt.
                hlsRecoverCount++;
                if (hlsRecoverCount > 3) {
                  disarmLoadWatchdog();
                  loadingEl.style.display = 'none';
                  showFatalError('Stream nicht erreichbar (' + (data.details || data.type) + ')');
                  return;
                }
                switch (data.type) {
                  case Hls.ErrorTypes.NETWORK_ERROR:
                    hls.startLoad();
                    break;
                  case Hls.ErrorTypes.MEDIA_ERROR:
                    hls.recoverMediaError();
                    break;
                  default:
                    disarmLoadWatchdog();
                    loadingEl.style.display = 'none';
                    showFatalError('Stream-Fehler (' + (data.details || data.type) + ')');
                    break;
                }
              }
            });
            renderAudioTracks();
          };
          if (typeof Hls !== 'undefined') { initHls(); }
          else { loadHlsJs(initHls); }
        } catch (e) {
          showError('Fehler: ' + e.message);
          loadingEl.style.display = 'none';
        }
      }

      // ── Initial load from URL params ──
      var params = new URLSearchParams(location.search);
      var hlsPath = params.get('hls');
      if (hlsPath) {
        try { window.__streamingHubHlsPath = decodeURIComponent(hlsPath); } catch (_) {}
      }
      setupChannel(
        params.get('channel'), params.get('name'), params.get('logo'),
        params.get('epg'), params.get('epgStart'), params.get('epgEnd'), params.get('epgNext')
      );

      function handleHostMessage(data) {
        if (!data) return;
        if (data.type === 'switch-channel') {
          tvDiagnostic('switch-received', { name: data.name || '', url: data.url || '' });
          setupChannel(data.url, data.name, data.logo, data.epg,
            data.epgStart, data.epgEnd, data.epgNext);
          if (data.dvr === 'on' || data.dvr === 'off') {
            dvrBarMode = data.dvr;
            applyDvrBarMode();
          }
          if (data.channelList && data.channelIndex !== undefined) {
            showChannelList(data.channelList, data.channelIndex);
          }
        } else if (data.type === 'channel-list') {
          if (data.channels && data.currentIndex !== undefined) {
            channelListData = data.channels;
            channelListIndex = data.currentIndex;
          }
        } else if (data.type === 'epg-update') {
          tvDiagnostic('epg-update', {
            entries: Array.isArray(data.epgEntries) ? data.epgEntries.length : null,
            title: !!data.epg,
            dvr: data.dvr || 'auto',
          });
          updateEpgBar(data.epg, data.epgStart, data.epgEnd, data.epgNext);
          // U2: Roh-EPG sofort übernehmen und Marker rendern — der Push passiert
          // beim Kanalwechsel/did-finish-load, nicht erst nach 30s-Poll.
          if (data.epgEntries && Array.isArray(data.epgEntries)) {
            epgEntries = data.epgEntries;
            epgMarkersStale = true;
            recomputeDvrMarkers();
          } else if (data.epgEntries === null) {
            epgEntries = [];
            recomputeDvrMarkers();
          }
          // U1: Bar-Modus-Signal vom Host ('on'|'off'|'auto') anwenden
          if (data.dvr === 'on' || data.dvr === 'off') {
            dvrBarMode = data.dvr;
            applyDvrBarMode();
          }
        }
      }

      window.addEventListener('streaming-hub-tv-command', function(e) {
        handleHostMessage(e.detail);
      });

      // Backward-compatible message listener for page-originated commands.
      window.addEventListener('message', function(e) {
        if (e.source !== window || e.origin !== window.location.origin || !e.data) return;
        handleHostMessage(e.data);
      });

      // ── Show/hide controls overlay ──
      function showOverlay() {
        topOverlay.classList.add('visible');
        controls.classList.add('visible');
        clearTimeout(hideOverlayTimer);
        hideOverlayTimer = setTimeout(function() {
          if (isPlaying) {
            topOverlay.classList.remove('visible');
            controls.classList.remove('visible');
          }
        }, 3000);
      }

      function hideOverlay() {
        topOverlay.classList.remove('visible');
        controls.classList.remove('visible');
      }

      document.addEventListener('mousemove', showOverlay);
      document.addEventListener('keydown', showOverlay);
      video.addEventListener('mousemove', showOverlay);

      // ── Play/Pause ──
      function togglePlay() {
        if (video.paused) { video.play(); }
        else { video.pause(); }
      }

      function updatePlayState() {
        isPlaying = !video.paused;
        playIcon.style.display = video.paused ? 'block' : 'none';
        pauseIcon.style.display = video.paused ? 'none' : 'block';
      }

      playBtn.addEventListener('click', togglePlay);
      video.addEventListener('play', updatePlayState);
      video.addEventListener('pause', updatePlayState);

      // ── Time update ──
      function formatTime(t) {
        if (!t || !isFinite(t)) return '00:00';
        const h = Math.floor(t / 3600);
        const m = Math.floor((t % 3600) / 60);
        const s = Math.floor(t % 60);
        if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
        return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
      }

      video.addEventListener('timeupdate', function() {
        if (video.duration && isFinite(video.duration)) {
          progress.value = (video.currentTime / video.duration) * 100;
          timeEl.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration - video.currentTime);
        }
      });
      // DVR: DVR-Fenster auffrischen + Zeitanzeige relativ zur Live-Kante (Timeshift)
      video.addEventListener('timeupdate', function() {
        if (dvrState.enabled) {
          var wasLive = dvrState.isLive;
          dvrState.isLive = video.currentTime >= dvrState.windowEnd - 30;
          if (wasLive !== dvrState.isLive) updateLiveUi();
          var behind = Math.max(0, dvrState.windowEnd - video.currentTime);
          timeEl.textContent = formatTime(behind) + ' hinter Live' + (dvrState.isLive ? ' · LIVE' : ' · TIMESHIFT');
          if (epgMarkersStale) recomputeDvrMarkers();
        }
      });
      video.addEventListener('seeking', function() {
        if (dvrState.enabled) {
          var target = video.currentTime;
          dvrState.isLive = target >= dvrState.windowEnd - 30;
          updateLiveUi();
        }
      });
      video.addEventListener('timeupdate', function() { lastStallTime = Date.now(); });
      video.addEventListener('pause', function() { if (stallTimer) { clearInterval(stallTimer); stallTimer = null; } });

      progress.addEventListener('input', function() {
        if (!dvrState.enabled && video.duration && isFinite(video.duration)) {
          video.currentTime = (progress.value / 100) * video.duration;
        }
      });

      // ── Volume ──
      volumeSlider.addEventListener('input', function() {
        video.volume = volumeSlider.value;
        video.muted = false;
      });

      muteBtn.addEventListener('click', function() {
        video.muted = !video.muted;
      });

      video.addEventListener('volumechange', function() {
        volumeSlider.value = video.muted ? 0 : video.volume;
      });

      // ── Fullscreen ──
      fullscreenBtn.addEventListener('click', function() {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          document.body.requestFullscreen();
        }
      });

      // ── Keyboard shortcuts ──
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT') return;
        if (document.getElementById('tvChannelList').classList.contains('visible')) {
          resetChannelListTimer();
        }
        switch (e.key) {
          case ' ':
          case 'k': e.preventDefault(); togglePlay(); break;
          case 'f':
          case 'F': e.preventDefault(); fullscreenBtn.click(); break;
          case 'm':
          case 'M': e.preventDefault(); muteBtn.click(); break;
          case 'ArrowLeft': e.preventDefault(); if (dvrState.enabled) trySeek(video.currentTime - 10); else video.currentTime = Math.max(0, video.currentTime - 10); break;
          case 'ArrowRight': e.preventDefault(); if (dvrState.enabled) { if (!dvrState.isLive) trySeek(video.currentTime + 10); } else video.currentTime = Math.min(video.duration, video.currentTime + 10); break;
          case 'l':
          case 'L': if (dvrState.enabled) { e.preventDefault(); goLive(); } break;
          case '=':
          case '+': e.preventDefault(); video.volume = Math.min(1, video.volume + 0.1); break;
          case '-':
          case '_': e.preventDefault(); video.volume = Math.max(0, video.volume - 0.1); break;
        }
      });

      // ── Error ──
      // W2: Persistenter Fehlerdialog für tote Streams – bleibt sichtbar bis zur
      // nächsten Kanalwahl (statt nach 6s zu verschwinden), nennt den Sender und
      // weist auf den Senderwechsel hin (Pfeiltasten / Senderliste).
      function showFatalError(msg) {
        errorDiv.innerHTML =
          '<div style="font-size:24px;font-weight:600;margin-bottom:8px">' + msg + '</div>' +
          '<div style="font-size:15px;opacity:.85">Sender: ' + (channelNameEl.textContent || 'TV') +
          ' · Pfeiltasten ↑/↓ oder Senderliste (T) zum Wechseln</div>';
        errorDiv.style.whiteSpace = 'normal';
        errorDiv.style.display = 'block';
        clearTimeout(hideOverlayTimer);
        topOverlay.classList.add('visible');
        controls.classList.add('visible');
      }

      function showError(msg) {
        errorDiv.textContent = msg;
        errorDiv.style.whiteSpace = '';
        errorDiv.style.display = 'block';
        setTimeout(function() { errorDiv.style.display = 'none'; }, 6000);
      }

      // ── W2: Load-Watchdog ──
      // Bewaffnet sich SOFORT beim Kanalstart. Meldet nach STREAM_LOAD_TIMEOUT_MS
      // einen Fehler, solange kein Lebenszeichen (Canplay/Playing) kam.
      function armLoadWatchdog() {
        disarmLoadWatchdog();
        gotPlaybackSignal = false;
        hlsRecoverCount = 0;
        loadWatchdogTimer = setTimeout(function() {
          loadWatchdogTimer = null;
          if (gotPlaybackSignal) return;
          // W2: hls.js stoppen, damit keine startLoad()-Retruns mehr laufen
          if (hlsInstance) { try { hlsInstance.destroy(); } catch (e) {} hlsInstance = null; }
          loadingEl.style.display = 'none';
          showFatalError('Sender nicht erreichbar – Stream startet nicht');
        }, STREAM_LOAD_TIMEOUT_MS);
      }

      function disarmLoadWatchdog() {
        if (loadWatchdogTimer) { clearTimeout(loadWatchdogTimer); loadWatchdogTimer = null; }
      }

      function signalPlayback() {
        if (!gotPlaybackSignal) {
          gotPlaybackSignal = true;
          disarmLoadWatchdog();
        }
        // W2: jedes echte Lebenszeichen setzt die Recovery-Fehlerbilanz zurück –
        // erfolgreich wiederhergestellte Streamaussetzer zählen nicht weiter.
        hlsRecoverCount = 0;
      }

      // ── Audio track handling ──
      function parseAudioTracksFromManifest(str) {
        const tracks = [];
        const seen = {};
        const re = /#EXT-X-MEDIA:TYPE=AUDIO,([\s\S]+?)(?=#EXT-X-|\n|$)/g;
        let m;
        while ((m = re.exec(str)) !== null) {
          const attrs = {};
          m[1].split(',').forEach(function(p) {
            const eq = p.indexOf('=');
            if (eq > 0) attrs[p.slice(0, eq).trim()] = p.slice(eq + 1).trim().replace(/^"(.*)"$/, '$1');
          });
          const name = attrs.NAME;
          if (name && !seen[name]) {
            seen[name] = 1;
            tracks.push({ name: name, groupId: attrs['GROUP-ID'] || '', lang: attrs.LANGUAGE || '', 'default': attrs.DEFAULT === 'YES', uri: attrs.URI, hlsId: -1 });
          }
        }
        return tracks;
      }

      function setAudioTracks(newTracks) {
        if (!newTracks || !newTracks.length) return;
        audioTracks = newTracks;
        renderAudioTracks();
      }

      function renderAudioTracks() {
        var tracks = audioTracks.length ? audioTracks : [{ name: 'Standard' }];
        var hasReal = audioTracks.length > 0;
        audioWrap.style.display = '';
        audioDropdown.innerHTML = '';
        var activeIdx = hasReal ? 0 : -1;
        if (hlsInstance) { activeIdx = Math.max(0, hlsInstance.audioTrack); }
        else if (hasReal && video.audioTracks) {
          Array.from(video.audioTracks).some(function(at, ai) { if (at.enabled) { activeIdx = ai; return true; } });
        }
        tracks.forEach(function(t, i) {
          var isActive = activeIdx === i || (!hasReal && i === 0);
          var item = document.createElement('div');
          item.className = 'tv-audio-item' + (isActive ? ' active' : '');
          var trackLabel = t.name || 'Track ' + (i + 1);
          item.textContent = trackLabel;
          item.dataset.label = trackLabel;
          if (t.lang) item.textContent += ' (' + t.lang + ')';
          item.dataset.index = i;
          item.addEventListener('click', function(e) {
            e.stopPropagation();
            if (hlsInstance && hasReal) hlsInstance.audioTrack = i;
            else if (hasReal && video.audioTracks) Array.from(video.audioTracks).forEach(function(at, ai) { at.enabled = ai === i; });
            audioDropdown.querySelectorAll('.tv-audio-item').forEach(function(el) { el.classList.remove('active'); });
            item.classList.add('active'); audioBtn.textContent = '🔊 ' + (item.dataset.label || item.textContent.replace(/\s*\([^)]*\)\s*$/, '').trim()); audioDropdown.classList.remove('open');
          });
          audioDropdown.appendChild(item);
        });
        var activeTrack = activeIdx >= 0 && hasReal ? tracks[activeIdx] : tracks[0];
        audioBtn.textContent = '🔊 ' + (activeTrack ? activeTrack.name : 'Standard');
      }

      audioBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        audioDropdown.classList.toggle('open');
      });
      document.addEventListener('click', function() { audioDropdown.classList.remove('open'); });

      // Init volume
      video.volume = 0.5;
    })();
  </script>
</body>
</html>
