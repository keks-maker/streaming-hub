<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streaming Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      background: #0a0a0f;
      color: #f0f0f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }
    .welcome { text-align: center; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .icon {
      width: 100px; height: 100px; border-radius: 26px;
      background: linear-gradient(135deg, #6c5ce7, #a78bfa);
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; font-weight: 700; color: #fff;
      margin: 0 auto 24px; box-shadow: 0 8px 40px rgba(108,92,231,0.3);
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { box-shadow:0 8px 40px rgba(108,92,231,0.3); } 50% { box-shadow:0 8px 60px rgba(108,92,231,0.45); } }
    h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 8px; }
    p { font-size: 15px; color: rgba(240,240,245,0.5); }
    .hint { margin-top: 32px; font-size: 12px; color: rgba(240,240,245,0.25); }
    kbd { display: inline-block; padding: 2px 6px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 4px; font-size: 11px; font-family: inherit; }
  </style>
</head>
<body>
  <div class="welcome">
    <div class="icon">S</div>
    <h1>Streaming Hub</h1>
    <p>W&auml;hle einen Dienst aus der Sidebar</p>
    <div class="hint">Dr&uuml;cke <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>H</kbd> f&uuml;r die Sidebar</div>
  </div>
</body>
</html>
