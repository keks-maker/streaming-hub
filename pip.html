<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a0a0f; overflow:hidden; height:100vh;
  display:flex; flex-direction:column; user-select:none;
}
.pip-bar {
  height:32px; background:rgba(10,10,15,0.96); display:flex;
  align-items:center; justify-content:space-between;
  padding:0 10px; flex-shrink:0; -webkit-app-region:drag;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.pip-title { font-size:12px; color:rgba(240,240,245,0.4); }
.pip-close {
  width:28px; height:28px; border:none; background:transparent;
  color:rgba(240,240,245,0.4); border-radius:6px; cursor:pointer;
  font-size:18px; line-height:1; display:flex; align-items:center;
  justify-content:center; -webkit-app-region:no-drag;
  transition:background .15s, color .15s;
}
.pip-close:hover { background:rgba(255,255,255,0.08); color:#f0f0f5; }
.pip-content { flex:1; position:relative; }
webview { position:absolute; inset:0; width:100%; height:100%; border:none; }
</style>
</head>
<body>
<div class="pip-bar">
  <span class="pip-title">Streaming Hub</span>
  <button class="pip-close" id="closeBtn">&times;</button>
</div>
<div class="pip-content">
  <webview id="pipView" partition="persist:streaming" preload="preload-content.js" plugins></webview>
</div>
<script>
document.getElementById('closeBtn').onclick = () => window.close();
window.addEventListener('message', (e) => {
  if (e.data.type === 'load-url') {
    document.getElementById('pipView').src = e.data.url;
  }
});
</script>
</body>
</html>
