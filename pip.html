<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob: https:; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'self';"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
        user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      }
      .pip-bar {
        height: 32px;
        background: rgba(10, 10, 15, 0.96);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        flex-shrink: 0;
        -webkit-app-region: drag;
        border-bottom: 1px solid var(--border);
      }
      .pip-title {
        font-size: 12px;
        color: var(--text-dim);
      }
      .pip-close {
        width: 28px;
        height: 28px;
        border: none;
        background: transparent;
        color: var(--text-dim);
        border-radius: 6px;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-app-region: no-drag;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .pip-close:hover {
        background: var(--glass-hover);
        color: var(--text);
      }
      .pip-content {
        flex: 1;
        position: relative;
      }
      webview,
      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
      }
      video {
        object-fit: contain;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div class="pip-bar">
      <span class="pip-title">Streaming Hub</span>
      <button class="pip-close" id="closeBtn">&times;</button>
    </div>
    <div class="pip-content">
      <webview id="pipView" partition="persist:streaming" preload="preload-content.js" plugins></webview>
      <video id="pipVideo" autoplay muted playsinline style="display: none"></video>
    </div>
    <script src="node_modules/hls.js/dist/hls.min.js"></script>
    <script>
      document.getElementById('closeBtn').onclick = () => window.close();

      const webview = document.getElementById('pipView');
      const video = document.getElementById('pipVideo');

      let activeHls = null;
      window.addEventListener('message', e => {
        if (e.source !== window || e.origin !== window.location.origin) return;
        if (!e.data || typeof e.data !== 'object' || Array.isArray(e.data)) return;
        if (!['load-url', 'load-tv-stream'].includes(e.data.type) || typeof e.data.url !== 'string') return;
        let target;
        try {
          target = new URL(e.data.url);
          if (!['http:', 'https:'].includes(target.protocol) || target.username || target.password) return;
        } catch (_) {
          return;
        }
        if (activeHls) {
          activeHls.destroy();
          activeHls = null;
        }
        if (e.data.type === 'load-url') {
          video.style.display = 'none';
          webview.style.display = 'block';
          webview.src = target.toString();
        } else if (e.data.type === 'load-tv-stream') {
          webview.style.display = 'none';
          video.style.display = 'block';

          // Unmute on first interaction
          document.addEventListener(
            'click',
            () => {
              video.muted = false;
            },
            { once: true },
          );
          document.addEventListener(
            'keydown',
            () => {
              video.muted = false;
            },
            { once: true },
          );

          if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = target.toString();
          } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
            activeHls = new Hls({ enableWorker: false, maxBufferLength: 30, liveSyncDuration: 15 });
            activeHls.loadSource(target.toString());
            activeHls.attachMedia(video);
            activeHls.on(Hls.Events.MANIFEST_PARSED, () => {
              video.play().catch(() => {});
            });
          } else {
            video.src = target.toString();
          }
        }
      });
    </script>
  </body>
</html>
