<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup C – Poster-zentriert</title>
<style>
/* Tokens aus styles.css (:root), nur dunkles Theme */
:root{
  --bg:#0a0a0f; --glass:rgba(255,255,255,0.04); --glass-hover:rgba(255,255,255,0.09);
  --border:rgba(255,255,255,0.07); --border-strong:rgba(255,255,255,0.16);
  --text:#f0f0f5; --text-dim:rgba(240,240,245,0.62); --text-muted:rgba(240,240,245,0.38);
  --accent:#6c5ce7; --accent-light:#a99bff; --accent-glow:rgba(108,92,231,0.3);
  --surface:#12121b; --surface-2:#191925; --ok:#3ddc97; --warn:#f5b84a; --err:#ff6b6b; --rec:#ff5d5d;
  --t:0.25s cubic-bezier(0.4,0,0.2,1);
  /* Genre-Farben (Farbe nie alleiniger Traeger: Genre steht im Tooltip/Panel) */
  --g-news:#4aa3ff; --g-sport:#2ecc71; --g-doku:#e0a43a; --g-kinder:#ff7eb6;
  --g-serie:#b388ff; --g-film:#ff6b5b; --g-show:#f5d04c; --g-musik:#2dd4bf; --g-none:#5b5b6b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:var(--accent-light)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[data-g]{--gc:var(--g-none)}
[data-g=news]{--gc:var(--g-news)}[data-g=sport]{--gc:var(--g-sport)}[data-g=doku]{--gc:var(--g-doku)}
[data-g=kinder]{--gc:var(--g-kinder)}[data-g=serie]{--gc:var(--g-serie)}[data-g=film]{--gc:var(--g-film)}
[data-g=show]{--gc:var(--g-show)}[data-g=musik]{--gc:var(--g-musik)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Mockup-Kopf ---------- */
.mk{background:#0e0e16;border-bottom:1px solid var(--border-strong);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.mk-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.mk-badge{background:var(--warn);color:#1a1200;font-weight:700;padding:3px 10px;border-radius:999px;font-size:12px;letter-spacing:.02em}
.mk-title{font-size:15px}
.mk-spacer{flex:1}
.mk-lbl{color:var(--text-dim);font-size:12px}
.mk-grp{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:3px 6px;border:1px solid var(--border);border-radius:8px;background:var(--glass)}
.mk-grp>.mk-lbl{margin-right:4px;text-transform:uppercase;letter-spacing:.05em;font-size:10.5px}
.mk-info{font-size:12px;color:var(--text-dim)}
.mk-link{font-size:13px}
.sb{padding:3px 9px;border-radius:6px;border:1px solid var(--border);background:var(--glass);font-size:12px;color:var(--text)}
.sb:hover{background:var(--glass-hover)}
.sb[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.stage{padding:14px 16px 6px;display:flex;justify-content:center}
.frame{position:relative;width:1280px;max-width:100%;height:min(80vh,780px);min-height:560px;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.gaps{padding:6px 16px 22px;max-width:1312px;margin:0 auto}
.gaps-box{border:1px dashed var(--border-strong);border-radius:10px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--text-dim)}
.gaps-box strong{color:var(--text)}
.gaps-box .sb{font-size:12px}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#000c;border:1px solid var(--border-strong);padding:7px 14px;border-radius:999px;font-size:13px;z-index:50;pointer-events:none;opacity:0;transition:opacity var(--t)}
.toast.on{opacity:1}

/* ---------- Bausteine ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--glass);color:var(--text);font-size:13px;white-space:nowrap}
.btn:hover{background:var(--glass-hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.sm{padding:3px 9px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--border-strong);background:var(--glass);font-size:12.5px;white-space:nowrap;color:var(--text)}
.chip:hover{background:var(--glass-hover)}
.chip[aria-pressed=true],.chip[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--gc,var(--g-none));flex:none}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
.seg button{padding:5px 11px;font-size:12.5px;background:var(--glass);border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.seg button:hover{background:var(--glass-hover)}
.seg button[aria-pressed=true]:hover{background:var(--accent)}
.seg-l{font-size:11px;color:var(--text-dim);margin-right:4px}
.swl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-dim);cursor:pointer;white-space:nowrap}
.swl input{accent-color:var(--accent);width:15px;height:15px}
.field{background:var(--glass);border:1px solid var(--border-strong);border-radius:8px;padding:6px 10px;min-width:0;color:var(--text)}
.field::placeholder{color:var(--text-muted)}
.gdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gc,var(--g-none));margin-right:5px;vertical-align:baseline}
.gchip{display:none;font-size:10.5px;padding:0 6px;border-radius:999px;border:1px solid var(--gc,var(--g-none));color:var(--text);line-height:16px;white-space:nowrap}
mark{background:rgba(245,208,76,.35);color:inherit;border-radius:2px;padding:0 1px}

/* Marker: geplant (ruhig) / laufend (pulsierend) */
.mk-plan,.mk-run{font-size:12px;line-height:1;flex:none}
.mk-plan{color:var(--accent-light)}
.mk-run{color:var(--rec);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.mk-run{animation:none}.skel::after{animation:none!important}.toast{transition:none}}

.prog{height:3px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent-light)}
.thumb{background:linear-gradient(145deg,hsl(var(--h,260) 45% 30%),hsl(calc(var(--h,260) + 40) 50% 14%));border-radius:6px;flex:none;position:relative;overflow:hidden;color:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-weight:700}
.logo{width:34px;height:34px;border-radius:8px;flex:none;background:linear-gradient(145deg,hsl(var(--h,260) 55% 38%),hsl(calc(var(--h,260) + 30) 55% 20%));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.notice{border-radius:8px;padding:8px 10px;font-size:13px;border:1px solid var(--border-strong);background:var(--glass);display:flex;gap:8px;align-items:flex-start}
.notice.warn{border-color:rgba(245,184,74,.5);background:rgba(245,184,74,.08)}
.notice.info{border-color:rgba(169,155,255,.4);background:rgba(108,92,231,.1)}
.notice b{font-weight:600}
.dim{color:var(--text-dim)}.mut{color:var(--text-muted)}

/* ---------- Detail-Panel (Inhalt gemeinsam, Platzierung je Variante) ---------- */
.pn{display:flex;flex-direction:column;min-height:0;background:var(--surface-2);color:var(--text)}
.pn-top{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);flex:none}
.pn-body{padding:12px 14px 16px;overflow:auto;display:flex;flex-direction:column;gap:9px;min-height:0}
.pn-poster{border-radius:8px;aspect-ratio:2/3;width:120px}
.pn-title{margin:0;font-size:19px;line-height:1.25;overflow-wrap:anywhere}
.pn-when,.pn-meta,.pn-cast{margin:0;font-size:13px;color:var(--text-dim)}
.pn-meta{color:var(--text)}
.pn-desc{margin:0;font-size:13.5px;line-height:1.5}
.pn-rec{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.pn-rec .okt{color:var(--ok);font-weight:600}
.pn-actions{display:flex;flex-wrap:wrap;gap:8px}
.pn-link{font-size:13px;color:var(--accent-light);text-decoration:underline;text-underline-offset:2px}
.pn-also h3{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim)}
.pn-also ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.pn-also li button{width:100%;padding:4px 6px;border-radius:6px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.pn-also li button:hover{background:var(--glass-hover)}
.pn-more{font-size:12px;color:var(--text-dim);padding:2px 6px}

/* ---------- Jetzt & Gleich ---------- */
.jng{display:flex;flex-direction:column;min-height:0}
.jng-head,.jng-row{display:grid;grid-template-columns:150px minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:stretch}
.jng-head{padding:6px 12px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);border-bottom:1px solid var(--border)}
.jng-row{padding:6px 12px;border-bottom:1px solid var(--border)}
.jng-chan{display:flex;align-items:center;gap:8px;padding:4px;border-radius:8px;min-width:0}
.jng-chan:hover{background:var(--glass-hover)}
.jng-chan span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jng-cell{display:flex;gap:9px;align-items:center;padding:6px;border-radius:8px;min-width:0;border:1px solid transparent}
.jng-cell:hover{background:var(--glass-hover)}
.jng-cell.cur{background:var(--glass);border-color:var(--border)}
.jng-cell .tx{min-width:0;display:flex;flex-direction:column;gap:2px;flex:1}
.jng-cell .tt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.jng-cell .ts{font-size:12px;color:var(--text-dim)}
.jng-cell .thumb{width:64px;height:36px}
.jng-cell.empty{color:var(--text-muted);cursor:default}
.jng-cell.empty:hover{background:none}
.jng-note{padding:10px 14px;font-size:12.5px;color:var(--text-dim)}

/* ---------- Kanalansicht (Listenform) ---------- */
.cv{display:flex;flex-direction:column;min-height:0;flex:1}
.cv-head{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.cv-head .logo{width:44px;height:44px;font-size:14px}
.cv-head h2{margin:0;font-size:18px}
.cv-now{font-size:13px;color:var(--text-dim)}
.cv-tabs{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;border-bottom:1px solid var(--border);flex:none}
.cv-list{overflow:auto;flex:1;min-height:0;padding:4px 8px 16px;position:relative}
.cv-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:2px 8px;border-radius:8px;border-bottom:1px solid var(--border)}
.cv-row.past{opacity:.5}
.cv-row.run{background:rgba(108,92,231,.14);border-color:rgba(108,92,231,.4)}
.cv-row.nxt{background:var(--glass)}
.cv-main{padding:6px 4px;border-radius:6px;min-width:0;display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px;align-items:center}
.cv-main:hover{background:var(--glass-hover)}
.cv-t{font-variant-numeric:tabular-nums;font-size:13px}
.cv-t small{display:block;color:var(--text-dim);font-size:11px}
.cv-ti{min-width:0}
.cv-ti b{display:flex;gap:6px;align-items:center;overflow:hidden}
.cv-ti b span.tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-ti small{color:var(--text-dim);font-size:12px}
.cv-flag{font-size:10.5px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;line-height:16px;flex:none}
.cv-flag.n{background:#3b3b52}
.cv-act{font-size:12px;color:var(--text-dim);text-align:right;max-width:230px}
.cv-act .btn{font-size:12px;padding:3px 10px}
.cv-act .okt{color:var(--ok);font-weight:600}

/* ---------- Suche / Zustandsboxen ---------- */
.sr-list{list-style:none;margin:0;padding:0}
.sr-list li button{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 12px;border-bottom:1px solid var(--border);align-items:center}
.sr-list li button:hover{background:var(--glass-hover)}
.sr-t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.sr-m{font-size:12.5px;color:var(--text-dim);white-space:nowrap}
.sr-d{grid-column:1 / 3;font-size:12px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;font-size:12.5px;color:var(--text-dim);border-bottom:1px solid var(--border);flex-wrap:wrap}
.state-box{margin:auto;text-align:center;max-width:430px;padding:30px 20px;display:flex;flex-direction:column;gap:10px;align-items:center}
.state-box h3{margin:0;font-size:17px}
.state-box p{margin:0;color:var(--text-dim);font-size:13.5px}
.state-ic{width:46px;height:46px;border-radius:50%;border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-dim)}
.state-ic.err{border-color:var(--err);color:var(--err)}
.skel{position:relative;overflow:hidden;background:var(--glass);border-radius:8px}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.08),transparent);transform:translateX(-100%);animation:sh 1.4s infinite}
@keyframes sh{to{transform:translateX(100%)}}

@media (max-width:900px){
  .mk{padding:8px 12px}.stage{padding:10px 12px 4px}.gaps{padding:6px 12px 18px}
  .mk-spacer{display:none}
}
/* schmale Fensterbreite (per JS-Klasse, damit auch die Breiten-Simulation greift) */
.narrow .jng-head{display:none}
.narrow .jng-row{grid-template-columns:1fr;gap:2px;padding:8px 10px}
.narrow .cv-row{grid-template-columns:1fr;gap:2px}
.narrow .cv-act{text-align:left;max-width:none;padding:0 4px 4px}
.narrow .cv-main{grid-template-columns:96px minmax(0,1fr)}

.g-scroll{overflow:auto;position:relative;flex:1;min-height:0;min-width:0}
.g-inner{position:relative;min-height:100%}
.g-ruler{position:sticky;top:0;z-index:6;display:flex;height:34px;background:var(--surface-2);border-bottom:1px solid var(--border-strong)}
.g-corner{position:sticky;left:0;z-index:7;width:var(--chw);flex:none;background:var(--surface-2);border-right:1px solid var(--border-strong);display:flex;align-items:center;padding:0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim)}
.g-rt{position:relative;flex:none;height:100%}
.g-tk{position:absolute;top:0;bottom:0;border-left:1px solid var(--border);padding:9px 0 0 4px;font-size:11px;color:var(--text-dim);white-space:nowrap}
.g-tk.h{border-left-color:var(--border-strong)}
.g-tk.d{border-left:2px solid var(--accent);color:var(--text);font-weight:600;z-index:1}
.g-nowlbl{position:absolute;top:2px;transform:translateX(-50%);font-size:10px;background:var(--rec);color:#fff;padding:0 5px;border-radius:999px;z-index:2;white-space:nowrap}
.g-row{display:flex;height:var(--rowh);border-bottom:1px solid var(--border)}
.g-chan{position:sticky;left:0;z-index:4;width:var(--chw);flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--surface-2);border-right:1px solid var(--border-strong)}
.g-chan:hover{background:#242436}
.g-chan .g-cn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600}
.g-track{position:relative;flex:none;background-image:linear-gradient(to right,var(--border) 1px,transparent 1px);background-size:var(--gs) 100%}
.g-block{position:absolute;top:4px;bottom:4px;overflow:hidden;border-radius:6px;background:#242438;border:1px solid var(--border-strong);padding:4px 6px;display:flex;flex-direction:column;gap:1px;min-width:0}
.g-block:hover{background:#2f2f48;z-index:2}
.g-block .bt{display:flex;gap:5px;align-items:flex-start;font-weight:600;font-size:12.5px;line-height:1.2}
.g-block .bt .tx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.g-block .bm{font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-block .gchip{align-self:flex-start;margin-top:2px}
.g-block .prog{position:absolute;left:0;right:0;bottom:0;border-radius:0;height:4px}
.g-block.past{opacity:.45}
.g-block.run{border-color:var(--accent-light);background:#2b2850}
.g-block.dim{opacity:.28;filter:grayscale(.7)}
.g-block.sel{outline:2px solid var(--accent-light);outline-offset:-1px}
.g-block.g-noepg{background:repeating-linear-gradient(135deg,#1b1b28,#1b1b28 8px,#202030 8px,#202030 16px);border-style:dashed;color:var(--text-dim);justify-content:center}
.gd-bar .g-block[data-g]{border-left:4px solid var(--gc)}
.gd-bar .jng-cell[data-g],.gd-bar .cv-row[data-g]{border-left:3px solid var(--gc)}
.gd-chip .gchip{display:inline-block}
.g-now{position:absolute;top:0;bottom:0;width:2px;background:var(--rec);z-index:3;pointer-events:none;opacity:.85}
.g-block.prime{box-shadow:inset 0 2px 0 var(--accent-light)}
.a-tool{flex:none;border-bottom:1px solid var(--border-strong);background:var(--surface)}
.a-r{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;padding:7px 14px}
.a-r+.a-r{padding-top:0}
.a-days{display:flex;gap:6px;overflow-x:auto;flex:1 1 260px;min-width:0;padding:3px 2px}
.a-jumps{display:flex;gap:6px}
.a-seg{display:flex;align-items:center}
.a-seg[hidden],.a-days[hidden],.a-jumps[hidden],.c-sheet[hidden],.c-dayrow:has(.a-days[hidden]){display:none}
.sfield{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.c-sf{margin-left:auto}.c-sf .field{border-radius:999px;width:230px;padding:7px 14px}
.c-h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-right:6px}
.c-nav{border-radius:999px}
.c-nav button{padding:6px 16px}
.fchips{display:flex;gap:5px;flex-wrap:wrap}
.c-days .chip{padding:6px 14px;font-size:13px}
.c-scroll{flex:1;min-height:0;overflow:auto;padding:6px 0 24px;position:relative}
.c-sec{padding:6px 0 4px}
.c-rh{display:flex;align-items:center;gap:14px;padding:0 18px 4px}
.c-chb{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 3px;border-radius:999px}
.c-chb:hover{background:var(--glass-hover)}
.c-chb b{font-size:15px}
.c-rail{display:flex;gap:12px;overflow-x:auto;padding:4px 18px 10px;position:relative;scroll-padding:0 18px}
.c-card{flex:none;width:196px;display:flex;flex-direction:column;gap:4px;border-radius:12px;padding:0 0 4px;position:relative;text-align:left}
.c-img{display:block;position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:linear-gradient(145deg,hsl(var(--h) 45% 32%),hsl(calc(var(--h) + 40) 50% 14%));border:1px solid var(--border-strong)}
.c-img.noimg{background:repeating-linear-gradient(135deg,#1d1d2b,#1d1d2b 10px,#232335 10px,#232335 20px)}
.c-ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:rgba(255,255,255,.28)}
.noimg .c-ini{font-size:12px;font-weight:600;color:var(--text-muted);letter-spacing:.04em}
.c-badges{position:absolute;left:6px;top:6px;right:6px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.c-bm{background:#000a;border-radius:999px;padding:2px 6px;display:inline-flex}
.c-night{font-size:10.5px;background:#000a;border-radius:999px;padding:0 7px;line-height:16px}
.c-badges .gchip{background:#000a}

      for (const r of s.content.querySelectorAll('.c-rail[data-ch]')) {
        if (S.jump != null) {
          const key = S.jump === NOW ? q => +q.dataset.stop > NOW : q => +q.dataset.start >= S.jump;
          const card = [...r.children].find(q => q.dataset && q.dataset.start && key(q));
          r.scrollLeft = card ? Math.max(0, card.offsetLeft - 8) : 0;
        } else r.scrollLeft = C.rs[r.dataset.ch] || 0;
      }
    }
    if (S.view === 'channel' && !cn) { const run = s.content.querySelector('.c-gc.is-run'); if (run && s.content.scrollTop === 0) s.content.scrollTop = Math.max(0, run.offsetTop - 150); }
    // Detailansicht als Sheet ueber der ganzen Flaeche
    s.sheet.hidden = !S.sel; s.sheet.replaceChildren();
    if (S.sel) {
      const p = selSlot(); s.sheet.style.setProperty('--h', p ? hue(p) : 260);
      s.sheet.append(el('div', { class: 'c-sheet-in' }, detailNode({ cls: 'c-pn', poster: 'ph', label: 'Detailansicht' })));
    }
  },
  search() {
    const r = runSearch();
    if (r.short || !r.total) return searchNode();
    const box = el('div', { class: 'c-sres' });
    box.append(el('div', { class: 'sr-h' }, el('span', { text: r.total + ' Treffer für „' + S.query.trim() + '“' }),
      el('label', { class: 'swl' }, el('input', { type: 'checkbox', checked: S.desc || null, onchange: e => { S.desc = e.target.checked; render(); } }), 'Beschreibung durchsuchen'),
      el('button', { class: 'btn sm', onclick: () => { S.searchOpen = false; render(); } }, '✕ Suche schließen (Esc)')));
    const g = el('div', { class: 'c-grid' });
    for (const p of r.hits.slice(0, 24)) {
      const inTitle = fold(p.title).includes(fold(S.query.trim()));
      g.append(el('button', { class: 'c-res', 'data-g': p.genre, title: tip(p), data: { pid: p.id, fk: 's:' + p.id }, onclick: () => pick(p.id, { jump: 1 }) },
        el('span', { class: 'thumb c-rt', style: '--h:' + hue(p), 'aria-hidden': 'true', text: p.poster ? p.title.slice(0, 1) : '–' }),
        el('span', { class: 'c-rx' }, el('b', null, markerNode(p), ' ', hl(p.title, S.query)), el('span', { class: 'dim', text: CHBY[p.ch].name + ' · ' + whenStr(p.start) }), !inTitle && p.desc ? el('span', { class: 'sr-d' }, 'Beschreibung: ', hl(p.desc, S.query)) : null)));
    }
    box.append(g);
    if (r.total > 24) box.append(el('p', { class: 'jng-note', text: 'Mockup zeigt die ersten 24 von ' + r.total + ' Treffern (App: hartes Limit 200).' }));
    return box;
  },
  channel() {
    const c = CHBY[S.channel], p0 = slotsOf(c.id)[nowIdx(c.id)];
    const w = el('div', { class: 'c-chan gd-' + S.genreDisp });
    const hero = el('div', { class: 'c-hero', style: '--h:' + c.h },
      el('button', { class: 'btn sm', onclick: () => { S.view = 'home'; S.sel = null; render(); } }, '‹ Übersicht'),
      el('div', { class: 'c-hrow' }, el('span', { class: 'logo c-biglogo', style: '--h:' + c.h, 'aria-hidden': 'true', text: c.ab.slice(0, 4) }),
        el('div', { class: 'c-hx' }, el('h2', { text: c.name }),
          p0 && isRun(p0) ? el('div', { class: 'c-nowbox' }, el('span', { class: 'cv-flag', text: 'Jetzt läuft' }), ' ', el('b', { text: p0.title }), el('span', { class: 'dim', text: '  ' + hhmm(p0.start) + '–' + hhmm(p0.stop) + ' · noch ' + restMin(p0) + ' min' }), progNode(p0)) : el('div', { class: 'dim', text: 'Gerade keine Sendung im EPG' }),
          el('div', { class: 'pn-actions' }, el('button', { class: 'btn pri', onclick: () => toast('Mockup: öffnet „' + c.name + '“ im Player') }, 'Sender öffnen'), el('button', { class: 'btn', 'aria-disabled': c.med ? null : 'true', onclick: () => c.med && toast('Mockup: öffnet die Mediathek von ' + c.name) }, 'Mediathek')))));
    w.append(hero, dayTabs());
    const a = slotsOf(c.id).filter(p => tvDay(p.start) === S.chDay), nxt = S.chDay === tvDay(NOW) ? a.find(p => p.start > NOW) : null, g = el('div', { class: 'c-grid c-cgrid', role: 'list', 'aria-label': 'Sendungen von ' + c.name + ', TV-Tag ' + dayShort(S.chDay) });
    for (const p of a) {
      const run = isRun(p);
      g.append(el('div', { class: 'c-gc' + (run ? ' is-run' : '') + (p === nxt && !run ? ' is-nxt' : ''), role: 'listitem' },
        run ? el('span', { class: 'cv-flag', text: 'Jetzt' }) : p === nxt ? el('span', { class: 'cv-flag n', text: 'Nächste' }) : el('span', { class: 'c-sp' }),
        C.card(p), el('div', { class: 'c-act' }, slotAction(p))));
    }
    if (!a.length) g.append(el('p', { class: 'jng-note', text: 'Für diesen TV-Tag liegen keine Sendungen im Cache.' }));
    w.append(g); return w;
  },
};
boot(C);
