# v0.4.23 – Gitea Actions CI/CD Pipeline
# Voraussetzung: Gitea Actions Runner ist am Server registriert
name: CI/CD

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier Check
        run: npm run format:check

  build:
    name: Build AppImage
    needs: lint
    runs-on: ubuntu-latest
    # Nur auf Tags builden (Releases)
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbfile-dev \
            libnss3 libatk-bridge2.0-0 libgtk-3-0 \
            libdrm-dev libgbm-dev libpulse-dev \
            rpm

      - name: Install npm dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run build

      - name: Upload Release Asset
        uses: actions/gitea-release@v1
        with:
          gitea_url: http://192.168.4.105:3000
          repo_token: ${{ secrets.GITEA_TOKEN }}
          files: |
            release/*.AppImage
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
