<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Streaming Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-drag-region"></div>
    <div class="titlebar-buttons">
      <button class="titlebar-btn minimize" onclick="window.electronAPI.minimizeWindow()">&#9472;</button>
      <button class="titlebar-btn close" onclick="window.electronAPI.closeWindow()">&#9587;</button>
    </div>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="logo-text">Streaming Hub</span>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Dienste</div>

      <button class="nav-item" data-url="https://www.netflix.com">
        <span class="nav-icon netflix">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M5.398 0v.006c3.028 8.556 5.37 15.175 8.348 23.596 2.344.058 4.85.398 4.854.398-2.8-7.924-5.923-16.747-8.487-24zm8.489 0v9.63L18.6 22.951c.043.007.09.017.133.024V0zM5.398 1.05V24c1.873-.225 2.81-.312 4.715-.398v-9.22z"/>
          </svg>
        </span>
        <span class="nav-label">Netflix</span>
      </button>

      <button class="nav-item" data-url="https://www.youtube.com">
        <span class="nav-icon youtube">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
        </span>
        <span class="nav-label">YouTube</span>
      </button>

      <button class="nav-item" data-url="https://www.disneyplus.com">
        <span class="nav-icon disney">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <text x="12" y="15" text-anchor="middle" font-family="serif" font-size="10" font-weight="bold" fill="currentColor">D+</text>
          </svg>
        </span>
        <span class="nav-label">Disney+</span>
      </button>

      <button class="nav-item" data-url="https://www.primevideo.com">
        <span class="nav-icon prime">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
          </svg>
        </span>
        <span class="nav-label">Prime Video</span>
      </button>

      <button class="nav-item" data-url="https://www.twitch.tv">
        <span class="nav-icon twitch">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/>
          </svg>
        </span>
        <span class="nav-label">Twitch</span>
      </button>

      <button class="nav-item" data-url="https://open.spotify.com">
        <span class="nav-icon spotify">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
          </svg>
        </span>
        <span class="nav-label">Spotify</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <button class="sidebar-toggle-btn" id="sidebarToggle" title="Sidebar einklappen">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="11 17 6 12 11 7"></polyline>
          <polyline points="18 17 13 12 18 7"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <div class="toolbar" id="toolbar">
    <div class="toolbar-nav">
      <button class="toolbar-btn" id="backBtn" title="Zur&uuml;ck">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button class="toolbar-btn" id="forwardBtn" title="Vor">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
      <button class="toolbar-btn" id="reloadBtn" title="Neu laden">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
      </button>
    </div>
    <div class="toolbar-url" id="urlDisplay">W&auml;hle einen Dienst</div>
    <div class="toolbar-spacer"></div>
    <div class="toolbar-service-name" id="serviceName"></div>
  </div>

  <div class="welcome-screen" id="welcomeScreen">
    <div class="welcome-icon">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h2>Willkommen bei Streaming Hub</h2>
    <p>W&auml;hle einen Dienst aus der Sidebar</p>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
