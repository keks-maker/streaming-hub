<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Streaming Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="overlay-bar" id="overlayBar">
    <span class="overlay-location" id="overlayLocation">Startseite</span>
    <nav class="overlay-nav" id="overlayNav">
    </nav>
    <div class="overlay-actions">
      <button class="add-btn" id="addBtn" title="Dienste verwalten">+</button>
      <button class="pip-btn" id="pipBtn" title="Bild-in-Bild (Strg+P)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <rect x="11" y="9" width="9" height="6" rx="1"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="content-area" id="contentArea">
    <webview id="contentView" class="content-view"
             src="about:blank"
             partition="persist:streaming"
             preload="preload-content.js"
             plugins>
    </webview>
    <div class="welcome-screen" id="welcomeScreen">
      <div class="welcome-bg" id="welcomeBg"></div>

      <div class="welcome-arrow-wrap">
        <svg class="welcome-arrow" viewBox="0 0 40 260" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="ag" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#fff" stop-opacity=".08"/>
              <stop offset="50%" stop-color="#fff" stop-opacity=".3"/>
              <stop offset="100%" stop-color="#fff" stop-opacity=".7"/>
            </linearGradient>
            <linearGradient id="ag2" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
              <stop offset="70%" stop-color="#a78bfa" stop-opacity=".5"/>
              <stop offset="100%" stop-color="#a78bfa" stop-opacity=".9"/>
            </linearGradient>
          </defs>
          <line x1="20" y1="50" x2="20" y2="240" stroke="url(#ag)" stroke-width="4" stroke-dasharray="6 5"/>
          <line x1="20" y1="50" x2="20" y2="240" stroke="url(#ag2)" stroke-width="2" stroke-dasharray="6 5"/>
          <polyline points="4,70 20,45 36,70" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
          <polyline points="10,59 20,45 30,59" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>
        </svg>
      </div>

      <p class="welcome-text">Hier kannst du einen Streamingdienst<br>mit der Maus ausw&auml;hlen.</p>
    </div>
  </div>

  <!-- Service-Manager Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="addModal">
      <div class="modal-header">
        <span class="modal-title">Dienste verwalten</span>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="service-list" id="serviceList"></div>
        <div class="modal-divider"></div>
        <label class="modal-label">Name</label>
        <input class="modal-input" id="inputName" type="text" placeholder="z.B. Netflix">

        <label class="modal-label">URL</label>
        <input class="modal-input" id="inputUrl" type="url" placeholder="z.B. https://www.netflix.com">

        <label class="modal-label">Icon (URL oder Dateiname)</label>
        <input class="modal-input" id="inputIcon" type="text" placeholder="z.B. netflix.png oder https://…">

        <label class="modal-label">Akzentfarbe</label>
        <input class="modal-color" id="inputColor" type="color" value="#6c5ce7">
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn-save" id="modalSave">Hinzufügen</button>
      </div>
    </div>
  </div>

  <!-- Shortcuts Overlay -->
  <div class="shortcuts-overlay" id="shortcutsOverlay">
    <div class="shortcuts-panel">
      <div class="shortcuts-header">Tastaturkürzel</div>
      <div class="shortcuts-list">
        <div class="shortcut-row"><span class="shortcut-keys"><kbd>Strg</kbd> + <kbd>Tab</kbd></span><span class="shortcut-desc">Nächster Dienst</span></div>
        <div class="shortcut-row"><span class="shortcut-keys"><kbd>Strg</kbd> + <kbd>Umsch</kbd> + <kbd>Tab</kbd></span><span class="shortcut-desc">Vorheriger Dienst</span></div>
        <div class="shortcut-row"><span class="shortcut-keys"><kbd>Strg</kbd> + <kbd>P</kbd></span><span class="shortcut-desc">Bild-in-Bild umschalten</span></div>
        <div class="shortcut-row"><span class="shortcut-keys"><kbd>F11</kbd></span><span class="shortcut-desc">Vollbild umschalten</span></div>
        <div class="shortcut-row"><span class="shortcut-keys"><kbd>?</kbd></span><span class="shortcut-desc">Diese Übersicht</span></div>
        <div class="shortcut-row"><span class="shortcut-keys"><kbd>Escape</kbd></span><span class="shortcut-desc">Modal / Overlay schließen</span></div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
