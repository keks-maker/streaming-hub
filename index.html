<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Streaming Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="overlay-bar" id="overlayBar">
    <nav class="overlay-nav">
      <button class="nav-item" data-provider="netflix" data-url="https://www.netflix.com">
        <span class="nav-icon netflix">
          <img src="assets/icons/netflix.png" alt="Netflix">
        </span>
      </button>
      <button class="nav-item" data-provider="youtube" data-url="https://www.youtube.com">
        <span class="nav-icon youtube">
          <img src="assets/icons/youtube.png" alt="YouTube">
        </span>
      </button>
      <button class="nav-item" data-provider="disney" data-url="https://www.disneyplus.com">
        <span class="nav-icon disney">
          <img src="assets/icons/disney.png" alt="Disney+">
        </span>
      </button>
      <button class="nav-item" data-provider="prime" data-url="https://www.primevideo.com">
        <span class="nav-icon prime">
          <img src="assets/icons/prime.png" alt="Prime Video">
        </span>
      </button>
      <button class="nav-item" data-provider="twitch" data-url="https://www.twitch.tv">
        <span class="nav-icon twitch">
          <img src="assets/icons/twitch.png" alt="Twitch">
        </span>
      </button>
      <button class="nav-item" data-provider="spotify" data-url="https://open.spotify.com">
        <span class="nav-icon spotify">
          <img src="assets/icons/spotify.png" alt="Spotify">
        </span>
      </button>
    </nav>
    <button class="fullscreen-btn" id="fullscreenBtn" title="Vollbildmodus">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 3 21 3 21 9"></polyline>
        <polyline points="9 21 3 21 3 15"></polyline>
        <line x1="21" y1="3" x2="14" y2="10"></line>
        <line x1="3" y1="21" x2="10" y2="14"></line>
      </svg>
    </button>
  </div>

  <div class="toolbar" id="toolbar">
    <div class="toolbar-nav">
      <button class="toolbar-btn" id="backBtn" title="Zur&uuml;ck">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button class="toolbar-btn" id="forwardBtn" title="Vor">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
      <button class="toolbar-btn" id="reloadBtn" title="Neu laden">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
      </button>
    </div>
    <div class="toolbar-url" id="urlDisplay">W&auml;hle einen Dienst</div>
    <div class="toolbar-spacer"></div>
    <div class="toolbar-service-name" id="serviceName"></div>
  </div>

  <div class="welcome-screen" id="welcomeScreen">
    <div class="welcome-icon">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h2>Willkommen bei Streaming Hub</h2>
    <p>W&auml;hle einen Dienst aus der Leiste</p>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
