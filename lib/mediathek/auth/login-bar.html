<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Anmeldung übernehmen</title>
<style>
  :root { color-scheme: light dark; --bg: #eef1f6; --fg: #1b1d21; --muted: #444b58; --line: #c3c8d2; --accent: #0b5fd3; --accent-fg: #ffffff; --ok: #1a7f37; --warn: #8a5a00; }
  @media (prefers-color-scheme: dark) { :root { --bg: #232831; --fg: #eceef2; --muted: #b6bcc8; --line: #444b58; --accent: #6aa4ff; --accent-fg: #0b1220; --ok: #5fd07f; --warn: #ffc765; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  main { box-sizing: border-box; height: 100%; padding: 0 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
  #status { flex: 1; min-width: 0; color: var(--muted); }
  #status[data-state=found] { color: var(--ok); }
  #status[data-state=none] { color: var(--warn); }
  button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; white-space: nowrap; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.55; cursor: default; }
</style>
</head>
<body>
<main>
  <span id="status" role="status" aria-live="polite">Angemeldet? Dann hier übernehmen.</span>
  <button id="accept" class="primary" type="button">Anmeldung übernehmen</button>
  <button id="cancel" type="button">Abbrechen</button>
</main>
<script src="login-bar-page.js"></script>
</body>
</html>
