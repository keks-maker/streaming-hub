<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>ZDF-Jugendschutz-PIN</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1b1d21; --muted: #5b6270; --line: #c3c8d2; --accent: #0b5fd3; --accent-fg: #ffffff; --err: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d2026; --fg: #eceef2; --muted: #a2a9b6; --line: #444b58; --accent: #6aa4ff; --accent-fg: #0b1220; --err: #ff8a80; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { box-sizing: border-box; padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
  h1 { font-size: 17px; margin: 0; }
  p { margin: 0; color: var(--muted); }
  input[type=password] { font: 600 24px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.5em; text-align: center; padding: 10px 8px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg); width: 9.5em; align-self: center; }
  input[type=password]:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  label { display: flex; gap: 8px; align-items: center; color: var(--muted); }
  .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: auto; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  #error { color: var(--err); min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <h1>ZDF-Jugendschutz-PIN eingeben</h1>
  <p id="info">Dieser Beitrag ist altersbeschränkt.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" pattern="[0-9]{4}" aria-label="Vierstellige PIN" autofocus>
  <label id="rememberRow" hidden><input id="remember" type="checkbox"> PIN merken (verschlüsselt auf diesem Gerät)</label>
  <p id="error" role="alert"></p>
  <div class="row"><button id="cancel" type="button">Abbrechen</button><button id="ok" class="primary" type="button" disabled>Freigeben</button></div>
</main>
<script src="zdf-pin-page.js"></script>
</body>
</html>
